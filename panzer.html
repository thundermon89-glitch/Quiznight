<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirnschmalz-Arena - Panzerschlacht</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Baloo 2', sans-serif; }
    .arena-bg { background: radial-gradient(ellipse at top, #3f6b28 0%, #14260c 70%); }
    .jax-card {
      background: #ffffff; border: 4px solid #1a1a2e; border-radius: 22px;
      box-shadow: 7px 7px 0 rgba(0,0,0,0.85);
    }
    .jax-btn {
      font-family: 'Baloo 2', sans-serif; border: 3px solid #1a1a2e; border-radius: 18px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.85); transition: transform .12s ease, box-shadow .12s ease;
    }
    .jax-btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(0,0,0,0.85); }
    .jax-btn:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.85); }
    #panzer-canvas { background: #4f8a34; border: 4px solid #1a1a2e; border-radius: 14px; touch-action: none; }
    @keyframes countdownPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .countdown-pop { animation: countdownPop 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes titlePop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .title-pop { animation: titlePop 0.6s cubic-bezier(.34,1.56,.64,1); }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, update, remove, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://play-ground-82b46-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let playerId = localStorage.getItem("quiz_player_id");
    if (!playerId) { window.location.href = "index.html"; }
    let isHost = false;
    let myName = "Spieler";
    let allPlayers = {};

    // ==== ARENA-MASSE ====
    const ARENA_W = 900, ARENA_H = 540;
    const TANK_SIZE = 42; // Kollisions-Fußabdruck bleibt quadratisch (einfacher & fair)
    const TANK_DRAW_W = 40, TANK_DRAW_LEN = 58; // das Bild selbst wird sichtbar in die Länge gezogen
    // Statt einer einzelnen großen Wand jetzt drei kleinere, diagonal über den Bildschirm
    // verteilte Wände mit Lücken dazwischen, durch die ein Panzer hindurchfahren kann.
    const WALLS = [
      { cx: 260, cy: 150, r: 62, glow: '#00e5ff' },
      { cx: 450, cy: 270, r: 62, glow: '#ff2ee0' },
      { cx: 640, cy: 390, r: 62, glow: '#39ff8c' }
    ];
    const MOVE_SPEED = 3.2;
    const BULLET_SPEED = 6.5;
    const BULLET_MAX_BOUNCES = 3;
    const EXPLOSION_MS = 550;
    const SHOOT_COOLDOWN_MS = 500;
    const START_LIVES = 3;

    // Mindestens 10 Startpunkte, gleichmäßig am Rand verteilt und weit von der Wand entfernt
    const SPAWN_POINTS = [
      { x: 40, y: 40, angle: 45 },
      { x: ARENA_W / 2 - 20, y: 20, angle: 90 },
      { x: ARENA_W - 82, y: 40, angle: 135 },
      { x: 20, y: ARENA_H / 2 - 20, angle: 0 },
      { x: ARENA_W - 62, y: ARENA_H / 2 - 20, angle: 180 },
      { x: 40, y: ARENA_H - 82, angle: -45 },
      { x: ARENA_W / 2 - 20, y: ARENA_H - 62, angle: -90 },
      { x: ARENA_W - 82, y: ARENA_H - 82, angle: -135 },
      { x: ARENA_W / 2 - 220, y: 20, angle: 90 },
      { x: ARENA_W / 2 + 180, y: 20, angle: 90 },
      { x: ARENA_W / 2 - 220, y: ARENA_H - 62, angle: -90 },
      { x: ARENA_W / 2 + 180, y: ARENA_H - 62, angle: -90 }
    ];

    const PANZER_IMG_URL = "https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/74c358da0a62eaf05646fc02faed88d16369ffa9/Panzer.png";
    const WALL_IMG_URL = "https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/74c358da0a62eaf05646fc02faed88d16369ffa9/peace-graffiti-.png";
    const EXPLOSION_IMG_URL = "https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/abf15658d4cff651ecd9ba993c5426a8d1033571/kevin-altman-explosion-boss-port.gif";

    const panzerImg = new Image(); panzerImg.src = PANZER_IMG_URL;
    const wallImg = new Image(); wallImg.src = WALL_IMG_URL;
    const explosionImg = new Image(); explosionImg.src = EXPLOSION_IMG_URL;

    onValue(ref(db, 'players/'), (snap) => { allPlayers = snap.val() || {}; });

    // NAVIGATION: sobald der Host alle zurückholt, folgen alle automatisch
    onValue(ref(db, 'gameState'), (snap) => {
      const gs = snap.val();
      if (gs && gs.status && gs.status !== 'in_game') {
        window.location.href = gs.status === 'waiting' ? "index.html" : "cockpit.html";
      }
    });

    window.hostEndPanzer = function() {
      if (!confirm("Spiel wirklich beenden und alle zurück ins Cockpit bringen?")) return;
      set(ref(db, 'panzerState'), null);
      update(ref(db, 'gameState'), { status: 'cockpit' });
    };

    function getActivePlayerIds() {
      return Object.keys(allPlayers).filter(id => {
        const n = allPlayers[id] && allPlayers[id].name;
        return n && !n.includes("Host") && !n.includes("Admin");
      });
    }

    // Für die Panzerschlacht gilt bewusst: JEDER spielt mit, auch der Admin/Host - anders als
    // bei den Quiz-Runden gibt's hier keinen Grund, warum er nur zuschauen sollte.
    function getAllParticipantIds() {
      return Object.keys(allPlayers).filter(id => allPlayers[id] && allPlayers[id].name);
    }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + ah && ay + ah > by;
    }
    // Wand ist jetzt ein Kreis (Durchmesser = Bildgröße) statt eines Vierecks - Kollision über
    // den nächstgelegenen Punkt des Quadrats (Panzer) zum Kreismittelpunkt.
    function overlapsWall(x, y, size) {
      for (const w of WALLS) {
        const closestX = Math.max(x, Math.min(w.cx, x + size));
        const closestY = Math.max(y, Math.min(w.cy, y + size));
        const dx = w.cx - closestX, dy = w.cy - closestY;
        if ((dx * dx + dy * dy) < (w.r * w.r)) return true;
      }
      return false;
    }
    // Für Geschosse (Punkt statt Quadrat): direkter Abstand zum jeweiligen Kreismittelpunkt.
    // Gibt die getroffene Wand zurück (für die Abprall-Richtung) oder null, falls keine.
    function findWallAtPoint(px, py) {
      for (const w of WALLS) {
        const dx = px - w.cx, dy = py - w.cy;
        if ((dx * dx + dy * dy) < (w.r * w.r)) return w;
      }
      return null;
    }

    // ==== EIGENER PANZER (lokal gesteuert, regelmäßig nach Firebase geschrieben) ====
    let my = null; // { x, y, angle, alive }
    let keys = { up: false, down: false, left: false, right: false };
    let lastShotAt = 0;
    let myBulletCounter = 0;
    let gameRunning = false;
    let iAmDead = false;
    let resultShown = false;

    function initMyTank() {
      const activeIds = getAllParticipantIds().sort(); // feste, für alle gleiche Reihenfolge - Admin spielt hier mit
      const myIndex = Math.max(0, activeIds.indexOf(playerId));
      const spawn = SPAWN_POINTS[myIndex % SPAWN_POINTS.length];
      my = { x: spawn.x, y: spawn.y, angle: spawn.angle, alive: true, lives: START_LIVES };
      iAmDead = false;
      resultShown = false;
      writeMyTank();
    }

    function writeMyTank() {
      update(ref(db, 'panzerState/tanks/' + playerId), {
        x: my.x, y: my.y, angle: my.angle, alive: my.alive, lives: my.lives, name: myName
      });
    }

    window.addEventListener('keydown', (e) => {
      if (!gameRunning || iAmDead) return;
      if (e.key === 'ArrowUp') { keys.up = true; e.preventDefault(); }
      if (e.key === 'ArrowDown') { keys.down = true; e.preventDefault(); }
      if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
      if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
      if (e.code === 'Space') { e.preventDefault(); tryShoot(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') keys.up = false;
      if (e.key === 'ArrowDown') keys.down = false;
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });

    // Eigene Geschosse werden hier lokal JEDEN Frame vollständig simuliert (Position,
    // Geschwindigkeit, Abpraller) - nur ein throttled Auszug davon geht an Firebase, damit
    // andere Clients sie sehen können. So bleibt die Physik robust und ruckelfrei, statt sie
    // nur rein zeitbasiert (ohne echten Bounce-Zustand) zu berechnen - das ließ Geschosse
    // vorher einfach durch die Wand "durchrechnen".
    let myBullets = {}; // bulletId -> { x, y, vx, vy, bounces }
    let myBulletsWriteTick = 0;

    function tryShoot() {
      const now = Date.now();
      if (now - lastShotAt < SHOOT_COOLDOWN_MS) return;
      lastShotAt = now;
      myBulletCounter++;
      const bulletId = playerId + '_b' + myBulletCounter;
      const rad = my.angle * Math.PI / 180;
      const bx = my.x + TANK_SIZE / 2 + Math.sin(rad) * (TANK_SIZE / 2 + 6);
      const by = my.y + TANK_SIZE / 2 - Math.cos(rad) * (TANK_SIZE / 2 + 6);
      myBullets[bulletId] = {
        x: bx, y: by,
        vx: Math.sin(rad) * BULLET_SPEED, vy: -Math.cos(rad) * BULLET_SPEED,
        bounces: 0
      };
      set(ref(db, 'panzerState/bullets/' + bulletId), {
        x: bx, y: by, vx: myBullets[bulletId].vx, vy: myBullets[bulletId].vy,
        bounces: 0, ownerId: playerId, ownerName: myName, createdAt: now
      });
    }

    // Prallt ein Geschoss von der Wand ab? Ermittelt, ob eher die linke/rechte oder obere/
    // untere Kante getroffen wurde, um die passende Geschwindigkeits-Komponente zu spiegeln.
    // Physikalisch korrektes Abprallen am Kreis: die Normale am Auftreffpunkt zeigt vom
    // Kreismittelpunkt zur Kugel, die Geschwindigkeit wird an dieser Normalen gespiegelt
    // (v' = v - 2*(v·n)*n) - das ergibt einen realistischen, winkeltreuen Abprall statt nur
    // grob geschätzt "die nächstgelegene Kante".
    function bounceOffWallIfNeeded(bl) {
      const w = findWallAtPoint(bl.x, bl.y);
      if (!w) return false;
      let nx = bl.x - w.cx, ny = bl.y - w.cy;
      const len = Math.hypot(nx, ny) || 1;
      nx /= len; ny /= len;

      const dot = bl.vx * nx + bl.vy * ny;
      bl.vx = bl.vx - 2 * dot * nx;
      bl.vy = bl.vy - 2 * dot * ny;

      // Kugel exakt auf den Kreisrand (plus etwas Puffer) zurücksetzen, damit sie nicht
      // sofort wieder als "drin" erkannt wird und mehrfach hintereinander abprallt
      bl.x = w.cx + nx * (w.r + 4);
      bl.y = w.cy + ny * (w.r + 4);
      return true;
    }

    function simulateMyBullets() {
      myBulletsWriteTick++;
      const shouldWrite = (myBulletsWriteTick % 2 === 0); // ~alle 2 Frames nach Firebase schreiben
      for (const bid in myBullets) {
        const bl = myBullets[bid];
        bl.x += bl.vx; bl.y += bl.vy;
        let bounced = false;

        // Abprallen an den Außenwänden der Arena
        if (bl.x <= 4 || bl.x >= ARENA_W - 4) { bl.vx *= -1; bl.x = Math.max(4, Math.min(ARENA_W - 4, bl.x)); bounced = true; }
        if (bl.y <= 4 || bl.y >= ARENA_H - 4) { bl.vy *= -1; bl.y = Math.max(4, Math.min(ARENA_H - 4, bl.y)); bounced = true; }
        // Abprallen an der Wand in der Mitte
        if (bounceOffWallIfNeeded(bl)) bounced = true;

        if (bounced) {
          bl.bounces++;
          if (bl.bounces >= BULLET_MAX_BOUNCES) {
            spawnExplosion(bl.x, bl.y, 46);
            remove(ref(db, 'panzerState/bullets/' + bid));
            delete myBullets[bid];
            continue;
          }
        }

        if (shouldWrite) {
          update(ref(db, 'panzerState/bullets/' + bid), { x: bl.x, y: bl.y, vx: bl.vx, vy: bl.vy, bounces: bl.bounces });
        }
      }
    }

    function tickMyMovement() {
      if (!gameRunning || iAmDead || !my) return;
      let dx = 0, dy = 0, newAngle = my.angle;
      if (keys.up) { dy = -MOVE_SPEED; newAngle = 0; }
      else if (keys.down) { dy = MOVE_SPEED; newAngle = 180; }
      else if (keys.left) { dx = -MOVE_SPEED; newAngle = -90; }
      else if (keys.right) { dx = MOVE_SPEED; newAngle = 90; }
      if (dx === 0 && dy === 0) return;

      let nx = Math.max(0, Math.min(ARENA_W - TANK_SIZE, my.x + dx));
      let ny = Math.max(0, Math.min(ARENA_H - TANK_SIZE, my.y + dy));
      // Wand blockiert Bewegung wie eine feste Mauer - kein Durchfahren möglich
      if (overlapsWall(nx, ny, TANK_SIZE)) { nx = my.x; ny = my.y; }

      my.x = nx; my.y = ny; my.angle = newAngle;
      writeMyTank();
    }

    // ==== ALLE PANZER & GESCHOSSE (aus Firebase gelesen, fürs Zeichnen fremder Geschosse und
    // für die eigene Treffer-Prüfung - jeder Client prüft nur, ob ER SELBST von einem fremden
    // Geschoss getroffen wird, das hält es einfach und robust). ====
    let allTanks = {};
    let allBullets = {};
    onValue(ref(db, 'panzerState/tanks'), (snap) => { allTanks = snap.val() || {}; });
    onValue(ref(db, 'panzerState/bullets'), (snap) => {
      allBullets = snap.val() || {};
      // Sicherheitsnetz: falls der Besitzer eines Geschosses mitten im Spiel die Seite
      // schließt, würde es sonst für immer in Firebase hängen bleiben.
      const now = Date.now();
      for (const bid in allBullets) {
        const b = allBullets[bid];
        if (b && b.createdAt && now - b.createdAt > 6000) remove(ref(db, 'panzerState/bullets/' + bid));
      }
    });

    // Kleine Explosionen (Geschoss- und Panzer-Treffer): GIFs animieren auf einem Canvas
    // NICHT (da erscheint nur ein Standbild) - deshalb hier als echtes <img>-Element auf einer
    // eigenen Ebene über dem Canvas, prozentual positioniert, damit es unabhängig von der
    // tatsächlichen Bildschirmgröße immer an der richtigen Stelle sitzt.
    function spawnExplosion(x, y, size) {
      const layer = document.getElementById("explosion-layer");
      if (!layer) return;
      const img = document.createElement('img');
      img.src = EXPLOSION_IMG_URL;
      img.style.position = 'absolute';
      img.style.left = ((x / ARENA_W) * 100) + '%';
      img.style.top = ((y / ARENA_H) * 100) + '%';
      img.style.width = ((size / ARENA_W) * 100) + '%';
      img.style.transform = 'translate(-50%, -50%)';
      img.style.pointerEvents = 'none';
      layer.appendChild(img);
      setTimeout(() => img.remove(), EXPLOSION_MS);
    }

    // Panzer-Explosionen für ALLE sichtbar machen: sobald ein Panzer laut Firebase von
    // lebendig auf tot wechselt, spielt JEDER Client (nicht nur das Opfer selbst) an dessen
    // letzter bekannter Position eine Explosion ab.
    let lastKnownAliveState = {};
    onValue(ref(db, 'panzerState/tanks'), (snap) => {
      const tanks = snap.val() || {};
      for (const tid in tanks) {
        const t = tanks[tid];
        const wasAlive = lastKnownAliveState[tid] !== false;
        if (wasAlive && t && t.alive === false) {
          spawnExplosion(t.x + TANK_SIZE / 2, t.y + TANK_SIZE / 2, TANK_SIZE * 1.6);
        }
        lastKnownAliveState[tid] = t ? t.alive !== false : true;
      }
    });

    function checkIfImHit() {
      if (!gameRunning || iAmDead || !my) return;
      for (const bid in allBullets) {
        const b = allBullets[bid];
        if (!b || b.ownerId === playerId) continue;
        const hit = b.x > my.x && b.x < my.x + TANK_SIZE && b.y > my.y && b.y < my.y + TANK_SIZE;
        if (hit) {
          remove(ref(db, 'panzerState/bullets/' + bid)); // Geschoss ist nach dem Treffer weg
          spawnExplosion(my.x + TANK_SIZE / 2, my.y + TANK_SIZE / 2, TANK_SIZE * 1.3); // explodiert IMMER sofort bei Treffer, egal wie oft sie schon abgeprallt ist
          my.lives = Math.max(0, (my.lives ?? START_LIVES) - 1);
          if (my.lives <= 0) {
            iAmDead = true;
            my.alive = false;
            runTransaction(ref(db, 'panzerState/kills/' + b.ownerId), (c) => (c || 0) + 1);
          }
          writeMyTank();
          break;
        }
      }
    }

    // ==== RENDERN ====
    const canvas = document.getElementById("panzer-canvas");
    const ctx = canvas.getContext("2d");

    // Kleines "Pixel-Herz" (5 kleine Blöcke in Herzform) - gefüllt = noch vorhandenes Leben,
    // grau/leer = bereits verlorenes Leben.
    function drawPixelHeart(cx, cy, blockSize, filled) {
      const pattern = [
        [1, 0, 1],
        [1, 1, 1],
        [0, 1, 0]
      ];
      ctx.fillStyle = filled ? '#ff2e6e' : 'rgba(255,255,255,0.25)';
      for (let row = 0; row < pattern.length; row++) {
        for (let col = 0; col < pattern[row].length; col++) {
          if (!pattern[row][col]) continue;
          ctx.fillRect(
            cx + (col - 1) * blockSize, cy + row * blockSize,
            blockSize - 0.5, blockSize - 0.5
          );
        }
      }
    }

    function drawTank(t, isMe) {
      ctx.save();
      ctx.translate(t.x + TANK_SIZE / 2, t.y + TANK_SIZE / 2);
      ctx.rotate(t.angle * Math.PI / 180);
      if (!t.alive) ctx.globalAlpha = 0.25;
      if (panzerImg.complete && panzerImg.naturalWidth > 0) {
        // Bild bewusst länger als breit gezeichnet (Fahrtrichtung = Länge)
        ctx.drawImage(panzerImg, -TANK_DRAW_W / 2, -TANK_DRAW_LEN / 2, TANK_DRAW_W, TANK_DRAW_LEN);
      } else {
        ctx.fillStyle = isMe ? '#7ed957' : '#ff2e93';
        ctx.fillRect(-TANK_SIZE / 2, -TANK_SIZE / 2, TANK_SIZE, TANK_SIZE);
      }
      ctx.restore();
      if (t.alive) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Baloo 2, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
        ctx.fillText(t.name || '', t.x + TANK_SIZE / 2, t.y - 16);
        ctx.shadowBlur = 0;

        // Herzen schwirren über dem Panzer
        const lives = t.lives ?? START_LIVES;
        const heartBlock = 3;
        const heartsWidth = START_LIVES * (heartBlock * 3 + 4);
        let hx = t.x + TANK_SIZE / 2 - heartsWidth / 2;
        for (let i = 0; i < START_LIVES; i++) {
          drawPixelHeart(hx, t.y - 12, heartBlock, i < lives);
          hx += heartBlock * 3 + 4;
        }
      }
    }

    function renderFrame() {
      ctx.clearRect(0, 0, ARENA_W, ARENA_H);
      // Boden-Textur (dezentes Gitter)
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      for (let gx = 0; gx < ARENA_W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, ARENA_H); ctx.stroke(); }
      for (let gy = 0; gy < ARENA_H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(ARENA_W, gy); ctx.stroke(); }

      // Drei kleinere, diagonal verteilte Wände statt einer großen - jede mit einem
      // pulsierenden Leucht-Schein im Hintergrund, kreisförmig zugeschnitten (durchsichtige
      // Ecken), passend zur kreisförmigen Kollision, mit Lücken dazwischen zum Durchfahren.
      const glowPulse = 0.55 + 0.35 * Math.sin(Date.now() / 450);
      for (const w of WALLS) {
        // Leucht-Schein im Hintergrund
        const grad = ctx.createRadialGradient(w.cx, w.cy, w.r * 0.5, w.cx, w.cy, w.r * 1.7);
        grad.addColorStop(0, w.glow + 'aa');
        grad.addColorStop(1, w.glow + '00');
        ctx.globalAlpha = glowPulse;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(w.cx, w.cy, w.r * 1.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.beginPath();
        ctx.arc(w.cx, w.cy, w.r, 0, Math.PI * 2);
        ctx.clip();
        if (wallImg.complete && wallImg.naturalWidth > 0) {
          ctx.drawImage(wallImg, w.cx - w.r, w.cy - w.r, w.r * 2, w.r * 2);
        } else {
          ctx.fillStyle = '#8a8a8a';
          ctx.fillRect(w.cx - w.r, w.cy - w.r, w.r * 2, w.r * 2);
        }
        ctx.restore();
        ctx.strokeStyle = w.glow;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = w.glow; ctx.shadowBlur = 10 * glowPulse;
        ctx.beginPath();
        ctx.arc(w.cx, w.cy, w.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Alle Panzer
      for (const pid in allTanks) {
        if (pid === playerId) continue;
        drawTank(allTanks[pid], false);
      }
      if (my) drawTank({ ...my, name: myName }, true);

      // Geschosse: eigene aus der lokalen, ruckelfreien Simulation, fremde aus Firebase
      ctx.fillStyle = '#ffd23f';
      for (const bid in myBullets) {
        const bl = myBullets[bid];
        ctx.beginPath();
        ctx.arc(bl.x, bl.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const bid in allBullets) {
        if (bid.startsWith(playerId + '_b')) continue; // eigene schon oben gezeichnet
        const b = allBullets[bid];
        if (!b) continue;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function gameLoop() {
      tickMyMovement();
      simulateMyBullets();
      checkIfImHit();
      renderFrame();
      maybeCheckGameOver();
      requestAnimationFrame(gameLoop);
    }

    // ==== SPIELENDE: sobald nur noch ein (oder gar kein) Panzer übrig ist ====
    let gameOverTriggered = false;
    function maybeCheckGameOver() {
      if (!gameRunning || gameOverTriggered) return;
      const activeIds = getAllParticipantIds();
      if (activeIds.length < 2) return; // Solospiel macht hier keinen Sinn geprüft
      const aliveIds = activeIds.filter(id => allTanks[id] && allTanks[id].alive !== false);
      if (aliveIds.length <= 1) {
        gameOverTriggered = true;
        finishRound(aliveIds[0] || null);
      }
    }

    function finishRound(winnerId) {
      if (isHost) {
        get(ref(db, 'players/')).then((snap) => {
          const players = snap.val() || {};
          const updates = { 'panzerState/finished': true, 'panzerState/winnerId': winnerId || null };
          if (winnerId && players[winnerId]) {
            updates['players/' + winnerId + '/score'] = (players[winnerId].score || 0) + 150;
          }
          update(ref(db), updates);
        });
      }
    }

    onValue(ref(db, 'panzerState/finished'), (snap) => {
      if (snap.val() && !resultShown) {
        resultShown = true;
        gameRunning = false;
        showResultScreen();
      }
    });

    function showResultScreen() {
      get(ref(db, 'panzerState/winnerId')).then((snap) => {
        const winnerId = snap.val();
        const winnerName = winnerId ? ((allPlayers[winnerId] || {}).name || 'Jemand') : null;
        document.getElementById("play-area").classList.add("hidden");
        const resultArea = document.getElementById("result-area");
        resultArea.classList.remove("hidden");
        document.getElementById("result-text").innerText = winnerName
          ? '🏆 ' + winnerName + ' hat als letzter Panzer überlebt und bekommt +150 Punkte!'
          : 'Alle Panzer wurden zerstört - unentschieden!';
        document.getElementById("my-status-text").innerText = iAmDead ? '💥 Du wurdest getroffen!' : (winnerId === playerId ? '🎉 Du hast gewonnen!' : '');
      });
    }

    // ==== START DER RUNDE (Countdown, dann Bewegung freigeben) ====
    function startCountdownThenPlay() {
      const overlay = document.getElementById("countdown-overlay");
      const numberEl = document.getElementById("countdown-number");
      overlay.classList.remove("hidden");
      let n = 3;
      numberEl.innerText = n;
      const iv = setInterval(() => {
        n--;
        if (n > 0) {
          numberEl.innerText = n;
          numberEl.classList.remove("countdown-pop"); void numberEl.offsetWidth; numberEl.classList.add("countdown-pop");
        } else {
          clearInterval(iv);
          overlay.classList.add("hidden");
          gameRunning = true;
          requestAnimationFrame(gameLoop);
        }
      }, 700);
    }

    window.onload = function() {
      if (!playerId) return;
      // Erst die KOMPLETTE Spielerliste laden und garantiert abwarten, bevor der eigene
      // Startpunkt berechnet wird - vorher lief das parallel zum separaten Live-Listener und
      // konnte bei mehreren gleichzeitig ladenden Spielern alle auf denselben Index (0)
      // zurückfallen lassen, wodurch sie sich alle am selben Punkt stapelten.
      get(ref(db, 'players/')).then((allSnap) => {
        allPlayers = allSnap.val() || {};
        const data = allPlayers[playerId];
        myName = (data && data.name) || 'Panzer-Pilot';
        if (data && data.name && (data.name.includes("Host") || data.name.includes("Admin"))) {
          isHost = true;
          document.getElementById("host-end-btn")?.classList.remove("hidden");
        }
        document.getElementById("player-info-name").innerText = myName;

        initMyTank();
        startCountdownThenPlay();
      });
    };
  </script>
</head>
<body class="arena-bg text-white min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden relative select-none">

  <button id="host-end-btn" onclick="hostEndPanzer()" class="hidden fixed bottom-4 right-4 z-30 py-3 px-4 jax-btn bg-[#ff2e93] text-white font-jax font-bold text-sm flex items-center justify-center gap-1.5">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8"/><path d="M14 12h7m0 0l-3-3m3 3l-3 3"/></svg> Spiel beenden & zurück ins Cockpit
  </button>

  <div id="countdown-overlay" class="hidden fixed inset-0 bg-black/85 z-[90] flex flex-col items-center justify-center">
    <div id="countdown-number" class="countdown-pop font-jax text-9xl font-extrabold text-[#7ed957]" style="text-shadow: 4px 4px 0 #08150a, -4px -4px 0 #08150a, 4px -4px 0 #08150a, -4px 4px 0 #08150a;">3</div>
    <div class="text-sm text-white/60 mt-4">Panzer, fertig machen!</div>
  </div>

  <div id="play-area" class="relative z-10 text-center w-full max-w-4xl">
    <h1 class="font-jax text-2xl md:text-4xl font-extrabold text-[#7ed957] title-pop mb-1" style="text-shadow: 3px 3px 0 #08150a, -3px -3px 0 #08150a, 3px -3px 0 #08150a, -3px 3px 0 #08150a;">
      🎖️ Panzerschlacht 🎖️
    </h1>
    <p class="text-xs text-white/60 mb-3">Pfeiltasten zum Fahren · Leertaste zum Schießen · ein Leben, keine zweite Chance!</p>
    <div class="relative w-full max-w-full mx-auto" style="aspect-ratio: 900/540;">
      <canvas id="panzer-canvas" width="900" height="540" class="w-full h-full block"></canvas>
      <div id="explosion-layer" class="absolute inset-0 pointer-events-none"></div>
    </div>
    <div class="text-xs text-white/50 mt-2">Du bist: <span id="player-info-name" class="font-bold text-[#7ed957]">...</span></div>
  </div>

  <div id="result-area" class="hidden relative z-10 jax-card p-8 max-w-sm text-center space-y-4 text-[#1a1a2e]">
    <div class="text-5xl">🎖️</div>
    <p id="result-text" class="text-sm font-bold"></p>
    <p id="my-status-text" class="text-sm"></p>
    <div class="text-xs text-[#1a1a2e]/50">Der Moderator bringt euch gleich zurück ins Cockpit...</div>
  </div>

</body>
</html>
