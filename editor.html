    let currentGameKey = "spiel1";
    let items = [];       // aktuell im Editor bearbeitete Liste
    let isDirty = false;

    function markDirty() {
      isDirty = true;
      document.getElementById("save-status").innerHTML =
        `<span class="text-[#ff2e93] font-jax font-bold">${icon('lock', 'w-4 h-4 inline -mt-1')} Ungespeicherte Änderungen</span>`;
    }
    function markSaved() {
      isDirty = false;
      document.getElementById("save-status").innerHTML =
        `<span class="text-[#7ed957] font-jax font-bold">${icon('check', 'w-4 h-4 inline -mt-1')} Gespeichert</span>`;
    }

    window.addEventListener('beforeunload', (e) => {
      if (isDirty) { e.preventDefault(); e.returnValue = ''; }
    });

    // ==== LADEN ====
    function loadActiveContent() {
      const game = GAMES[currentGameKey];
      get(ref(db, game.contentPath)).then((snap) => {
        const data = snap.val();
        // Fällt auf die echten, im Spiel eingebauten Standard-Fragen zurück (falls in
        // Firebase noch nichts gespeichert wurde) - nicht mehr auf eine einzelne Leerfrage.
        const fallback = (Array.isArray(game.defaults) && game.defaults.length > 0) ? game.defaults : [game.blank()];
        items = (Array.isArray(data) && data.length > 0) ? data : fallback;
        renderEditor();
        markSaved();
      });
    }

    function loadTemplateList() {
      const game = GAMES[currentGameKey];
      const select = document.getElementById("template-select");

    // ==== SPEICHERN (macht die Fragen im Spiel aktiv) ====
    // Welches Feld je Fragetyp den "ist diese Frage eigentlich ausgefüllt"-Test besteht
    const REQUIRED_FIELD = {
      imageQa: 'imageUrl',
      story: 'teaser',
      movieGuess: 'answer',
      distortedImage: 'title'
      // alle anderen Typen (quiz4, trueFalse, estimateImg, timeline) prüfen auf 'question'
    };

    window.saveActive = function() {
      const game = GAMES[currentGameKey];
      const requiredField = REQUIRED_FIELD[game.formType] || 'question';
      let cleaned = items.filter(it => (it[requiredField] || "").toString().trim().length > 0);
      if (cleaned.length === 0) {
        alert("Mindestens ein ausgefüllter Eintrag wird benötigt, bevor gespeichert werden kann.");
        return;
      }
      if (game.formType === 'timeline') {
        // correctOrder wird nicht von Hand gepflegt, sondern beim Speichern automatisch aus
        // den Jahreszahlen der Ereignisse berechnet - Ereignisse nach Jahr sortiert ergeben
        // direkt die richtige Reihenfolge.
        cleaned = cleaned.map(round => ({
          ...round,
          correctOrder: [...(round.events || [])].sort((a, b) => (a.year || 0) - (b.year || 0)).map(ev => ev.id)
        }));
      }
      set(ref(db, game.contentPath), cleaned).then(() => {
        items = cleaned;
        renderEditor();
        markSaved();
      });
    };

        let current = Array.isArray(items[idx].correct) ? items[idx].correct.slice() : [items[idx].correct];
        const pos = current.indexOf(optIdx);
        if (pos === -1) {
          current.push(optIdx);
        } else if (current.length > 1) {
          current.splice(pos, 1); // mindestens eine richtige Antwort muss bestehen bleiben

    // ==== BILD-UPLOAD ====
    // Bilder werden NICHT zu GitHub hochgeladen (dafür bräuchte es Zugangsdaten, die nicht ins
    // Frontend gehören), sondern direkt als Bilddaten in Firebase gespeichert - das funktioniert
    // aus Sicht des Spiels genauso wie eine normale Bild-URL. Damit die Datenbank nicht zu groß
    // wird, werden Bilder vorher automatisch verkleinert.
    const MAX_UPLOAD_DIMENSION = 900;
    const UPLOAD_JPEG_QUALITY = 0.82;

    window.handleImageUpload = function(idx, inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const statusEl = document.getElementById("upload-status-" + idx);
      if (statusEl) statusEl.innerText = "Bild wird verkleinert und hochgeladen...";

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > MAX_UPLOAD_DIMENSION) {
            height = Math.round(height * (MAX_UPLOAD_DIMENSION / width));
            width = MAX_UPLOAD_DIMENSION;
          } else if (height > MAX_UPLOAD_DIMENSION) {
            width = Math.round(width * (MAX_UPLOAD_DIMENSION / height));
            height = MAX_UPLOAD_DIMENSION;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", UPLOAD_JPEG_QUALITY);

          items[idx].imageUrl = dataUrl;
          markDirty();
          renderEditor();
        };
        img.onerror = () => { if (statusEl) statusEl.innerText = "Bild konnte nicht gelesen werden."; };
        img.src = e.target.result;
      };
      reader.onerror = () => { if (statusEl) statusEl.innerText = "Datei konnte nicht gelesen werden."; };
      reader.readAsDataURL(file);
    };

          <div class="text-[11px] text-[#1a1a2e]/50">Aktuell markiert als: ${q.correct === 0 ? '"WAHR"' : q.correct === 2 ? '"CREEPYPASTA"' : '"FALSCH"'} ist richtig</div>

          <div>

              oninput="updateField(${idx}, 'source', this.value)"

              class="jax-input w-24 text-sm" />

        </div>

    }

    function renderTimelineList(game) {
      return items.map((round, rIdx) => `
        <div class="jax-card p-5 space-y-3">
          <div class="flex items-center justify-between">
            <div class="jax-chip bg-[#7017c9] text-white px-3 py-1 text-xs font-jax font-bold">Runde ${rIdx + 1}</div>
            <div class="flex gap-1.5">
              <button onclick="moveQuestion(${rIdx}, -1)" class="w-8 h-8 jax-btn bg-white flex items-center justify-center" ${rIdx === 0 ? 'disabled' : ''}>${icon('up', 'w-4 h-4')}</button>
              <button onclick="moveQuestion(${rIdx}, 1)" class="w-8 h-8 jax-btn bg-white flex items-center justify-center" ${rIdx === items.length - 1 ? 'disabled' : ''}>${icon('down', 'w-4 h-4')}</button>
              <button onclick="deleteQuestion(${rIdx})" class="w-8 h-8 jax-btn bg-[#ff2e93] text-white flex items-center justify-center">${icon('trash', 'w-4 h-4')}</button>
            </div>
          </div>

          <div class="grid grid-cols-[80px_1fr_100px] gap-2">
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Emoji</label>
              <input type="text" autocomplete="off" value="${escapeAttr(round.emoji || '')}" oninput="updateField(${rIdx}, 'emoji', this.value)"
                class="jax-input w-full mt-1 text-sm text-center" />
            </div>
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Rundentext</label>
              <input type="text" autocomplete="off" value="${escapeAttr(round.question || '')}" placeholder="z.B. Bringe diese ... in die richtige Reihenfolge:"
                oninput="updateField(${rIdx}, 'question', this.value)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Punkte</label>
              <input type="number" autocomplete="off" value="${round.points ?? 200}" oninput="updateField(${rIdx}, 'points', parseInt(this.value, 10) || 0)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
          </div>

          <div class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase pt-1">Ereignisse (Reihenfolge wird beim Speichern automatisch nach Jahr sortiert)</div>
          <div class="space-y-2">
            ${(round.events || []).map((ev, eIdx) => `
              <div class="bg-[#f4f1ff] rounded-xl p-2 space-y-1.5">
                <div class="grid grid-cols-[50px_1fr_90px_36px] gap-2 items-start">
                  <div class="flex flex-col items-center gap-1">
                    <input type="text" autocomplete="off" value="${escapeAttr(ev.emoji || '')}" placeholder="🎮" oninput="updateEventField(${rIdx}, ${eIdx}, 'emoji', this.value)"
                      class="jax-input text-sm text-center w-full" title="Wird nur genutzt, wenn kein Bild gesetzt ist" />
                    ${ev.image ? `<img src="${escapeAttr(ev.image)}" class="w-10 h-10 rounded object-cover border-2 border-[#1a1a2e]" alt="">` : ''}
                  </div>
                  <div class="space-y-1">
                    <input type="text" autocomplete="off" value="${escapeAttr(ev.label || '')}" placeholder="Bezeichnung..." oninput="updateEventField(${rIdx}, ${eIdx}, 'label', this.value)"
                      class="jax-input w-full text-sm" />
                    <input type="text" autocomplete="off" value="${escapeAttr(ev.fact || '')}" placeholder="Hintergrundtext (optional)..." oninput="updateEventField(${rIdx}, ${eIdx}, 'fact', this.value)"
                      class="jax-input w-full text-xs" />
                  </div>
                  <input type="number" autocomplete="off" value="${ev.year ?? 2000}" placeholder="Jahr" oninput="updateEventField(${rIdx}, ${eIdx}, 'year', parseInt(this.value, 10) || 0)"
                    class="jax-input text-sm" />
                  <button onclick="removeEvent(${rIdx}, ${eIdx})" class="w-9 h-9 jax-btn bg-[#ff2e93] text-white flex items-center justify-center" ${(round.events || []).length <= 2 ? 'disabled title="Mindestens 2 Ereignisse nötig"' : ''}>${icon('trash', 'w-3.5 h-3.5')}</button>
                </div>
                <input type="text" autocomplete="off" value="${escapeAttr(ev.image || '')}" placeholder="Bild-Link (optional, ersetzt das Emoji, falls gesetzt)"
                  oninput="updateEventField(${rIdx}, ${eIdx}, 'image', this.value)"
                  class="jax-input w-full text-xs" />
              </div>
            `).join('')}
          </div>
          <button onclick="addEvent(${rIdx})" class="jax-btn bg-white text-[#1a1a2e] px-3 py-2 text-xs font-jax font-bold">+ Ereignis hinzufügen</button>
        </div>
      `).join('');
    }

    window.updateEventField = function(rIdx, eIdx, field, value) {
      if (!items[rIdx].events) items[rIdx].events = [];
      items[rIdx].events[eIdx] = { ...items[rIdx].events[eIdx], [field]: value };
      markDirty();
    };

    window.addEvent = function(rIdx) {
      if (!items[rIdx].events) items[rIdx].events = [];
      const nextLetter = String.fromCharCode(97 + items[rIdx].events.length); // a, b, c, ...
      items[rIdx].events.push({ id: nextLetter, label: '', emoji: '', year: 2000, fact: '' });
      renderEditor();
      markDirty();
    };

    window.removeEvent = function(rIdx, eIdx) {
      if ((items[rIdx].events || []).length <= 2) return; // mindestens 2 Ereignisse fuer eine sinnvolle Reihenfolge
      items[rIdx].events.splice(eIdx, 1);
      // IDs neu vergeben (a, b, c...), damit sie fortlaufend bleiben
      items[rIdx].events.forEach((ev, i) => { ev.id = String.fromCharCode(97 + i); });
      renderEditor();
      markDirty();
    };

    function renderEstimateImgList(game) {
      return items.map((q, idx) => `
        <div class="jax-card p-5 space-y-3">
          <div class="flex items-center justify-between">
            <div class="jax-chip bg-[#7017c9] text-white px-3 py-1 text-xs font-jax font-bold">Frage ${idx + 1}</div>
            <div class="flex gap-1.5">
              <button onclick="moveQuestion(${idx}, -1)" class="w-8 h-8 jax-btn bg-white flex items-center justify-center" ${idx === 0 ? 'disabled' : ''}>${icon('up', 'w-4 h-4')}</button>
              <button onclick="moveQuestion(${idx}, 1)" class="w-8 h-8 jax-btn bg-white flex items-center justify-center" ${idx === items.length - 1 ? 'disabled' : ''}>${icon('down', 'w-4 h-4')}</button>
              <button onclick="deleteQuestion(${idx})" class="w-8 h-8 jax-btn bg-[#ff2e93] text-white flex items-center justify-center">${icon('trash', 'w-4 h-4')}</button>
            </div>
          </div>

          <div>
            <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Frage / Titel</label>
            <input type="text" autocomplete="off" value="${escapeAttr(q.question || '')}" placeholder="Fragetext eingeben oder umbenennen..."
              oninput="updateField(${idx}, 'question', this.value)"
              class="jax-input w-full mt-1 text-base" />
          </div>

          <div class="flex items-center gap-4">
            <div class="w-24 h-24 flex-shrink-0 rounded-xl border-2 border-[#1a1a2e] bg-[#f4f1ff] flex items-center justify-center overflow-hidden">
              ${q.image
                ? `<img src="${escapeAttr(q.image)}" class="w-full h-full object-cover" />`
                : `<span class="text-[10px] text-[#1a1a2e]/40 text-center px-1">Kein Bild</span>`
              }
            </div>
            <div class="flex-1">
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Bild-Link (optional)</label>
              <input type="text" autocomplete="off" value="${escapeAttr(q.image || '')}" placeholder="https://... (z.B. eBay-Kleinanzeigen-Screenshot)"
                oninput="updateField(${idx}, 'image', this.value)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Antwort</label>
              <input type="number" autocomplete="off" step="any" value="${q.answer ?? 0}" oninput="updateField(${idx}, 'answer', parseFloat(this.value) || 0)"
                class="jax-input w-full mt-1 text-sm" style="border-color:#7ed957;" />
            </div>
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Einheit</label>
              <input type="text" autocomplete="off" value="${escapeAttr(q.unit || '')}" placeholder="z.B. €, m, kg, Stk." oninput="updateField(${idx}, 'unit', this.value)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Toleranz</label>
              <input type="number" autocomplete="off" step="any" value="${q.tolerance ?? 0}" oninput="updateField(${idx}, 'tolerance', parseFloat(this.value) || 0)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Punkte</label>

                class="jax-input w-full mt-1 text-sm" />

          </div>

          <div class="grid grid-cols-2 gap-2">

              <input type="number" autocomplete="off" step="any" value="${q.min ?? 0}" oninput="updateField(${idx}, 'min', parseFloat(this.value) || 0)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
            <div>
              <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Regler-Maximum</label>
              <input type="number" autocomplete="off" step="any" value="${q.max ?? 1000}" oninput="updateField(${idx}, 'max', parseFloat(this.value) || 0)"
                class="jax-input w-full mt-1 text-sm" />
            </div>
          </div>

          <div>
            <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Bild im Hintergrundtext (optional)</label>
            <input type="text" autocomplete="off" value="${escapeAttr(q.factImage || '')}" placeholder="https://... (wird über dem Hintergrundtext gezeigt)"
              oninput="updateField(${idx}, 'factImage', this.value)"
              class="jax-input w-full mt-1 text-sm" />
          </div>

          <div>
            <label class="text-[11px] font-jax font-bold text-[#1a1a2e]/60 uppercase">Hintergrundtext nach der Auflösung (optional)</label>
            <textarea oninput="updateField(${idx}, 'fact', this.value)" rows="2" placeholder="Zusätzlicher Erklärtext, der nach der Auflösung gezeigt wird..."
              class="jax-input w-full mt-1 text-sm">${escapeAttr(q.fact || '')}</textarea>
          </div>
        </div>
      `).join('');
    }

    function escapeAttr(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    window.switchGame = function(key) {
      if (key === currentGameKey) return;
      if (isDirty && !confirm("Du hast ungespeicherte Änderungen bei diesem Spiel - trotzdem wechseln und sie verwerfen?")) return;
      currentGameKey = key;
      renderGameTabs();
      loadActiveContent();
      loadTemplateList();
    };

    function renderGameTabs() {
      const wrap = document.getElementById("game-tabs");
      // Nach der Zahl im Spielnamen sortieren (spiel1, spiel2, spiel3...), nicht nach der
      // zufälligen Einfüge-Reihenfolge im GAMES-Objekt - "sekwars" o.ä. ohne Zahl landet hinten.
      const sortedKeys = Object.keys(GAMES).sort((a, b) => {
        const numA = parseInt((a.match(/\d+/) || [])[0], 10);
        const numB = parseInt((b.match(/\d+/) || [])[0], 10);
        if (isNaN(numA) && isNaN(numB)) return a.localeCompare(b);
        if (isNaN(numA)) return 1;
        if (isNaN(numB)) return -1;
        return numA - numB;
      });
      const activeTabs = sortedKeys.map(key => {
        const isActive = key === currentGameKey;
        return `<button onclick="switchGame('${key}')" class="game-tab selectable ${isActive ? 'active' : ''} px-4 py-2 text-xs font-jax font-bold" style="${isActive ? '' : 'background:#ffffff;'}">${GAMES[key].label}</button>`;
      }).join('');
      wrap.innerHTML = activeTabs;
    }

    window.onload = () => {
      renderGameTabs();
      loadActiveContent();
      loadTemplateList();
    };
  </script>
