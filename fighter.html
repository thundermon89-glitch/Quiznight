          return pose({ lean: -0.3, aF: [-0.6, 0.0], aB: [-1.0, -0.4], tilt: -0.3, lF: [0.2, 0.0], lB: [0.05, -0.1] });
        default:
          return pose({ aF: [0.9 + breathe, 2.55], aB: [0.55 - breathe, 2.45] });
      }
    }

    function limb(x1, y1, x2, y2, w, color) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111'; ctx.lineWidth = w + 5;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = color; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    function dot(x, y, r, color) {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    function shade(hex, amt) {
      // Farbe abdunkeln (für die hinteren Gliedmaßen)
      if (!hex.startsWith('#')) return hex;
      const n = parseInt(hex.slice(1), 16);
      const r = Math.max(0, ((n >> 16) & 255) * amt), g = Math.max(0, ((n >> 8) & 255) * amt), b = Math.max(0, (n & 255) * amt);
      return `rgb(${r | 0},${g | 0},${b | 0})`;
    }

    function fallAngle(act, f) {
      if (act === 'kd' || act === 'ko') return Math.min(1, f / 16) * 1.45;
      if (act === 'getup') return Math.max(0, 1 - f / 18) * 1.45;
      return 0;
    }

    function drawFighter(fd, pid, isMe) {
      const name = nameOf(pid);
      const ch = charFor(name);
      const sx = fd.x, sy = GROUND - (fd.y || 0);

      // Schatten am Boden (wird beim Springen kleiner und heller)
      const air = Math.min(1, (fd.y || 0) / 160);
      ctx.fillStyle = `rgba(0,0,0,${0.5 - air * 0.3})`;
      ctx.beginPath(); ctx.ellipse(sx, GROUND + 2, 48 - air * 26, 10 - air * 4, 0, 0, Math.PI * 2); ctx.fill();
      drawAura(fd, performance.now());

      const sprites = FIGHTER_SPRITES[name];
      if (sprites && drawSpriteFighter(fd, name, sprites)) { drawLabel(fd, pid, isMe, sy - (['kd', 'ko'].includes(fd.act) ? 70 : SPRITE_FIGURE_H + 12)); return; }

      const p = getPose(fd.act, fd.actF, fd.cr, fd.bc);
      // Skelett mit Hüfte bei (0,0) berechnen (lokal, Blick nach rechts)
      const seg = (ox, oy, ang, len) => [ox + Math.sin(ang) * len, oy + Math.cos(ang) * len];
      const kneeF = seg(0, 0, p.lF[0], L.thigh), footF = seg(kneeF[0], kneeF[1], p.lF[1], L.shin);
      const kneeB = seg(0, 0, p.lB[0], L.thigh), footB = seg(kneeB[0], kneeB[1], p.lB[1], L.shin);
      const sh = [Math.sin(p.lean) * L.torso, -Math.cos(p.lean) * L.torso];
      const elF = seg(sh[0], sh[1], p.aF[0], L.upper), hdF = seg(elF[0], elF[1], p.aF[1], L.fore);
      const elB = seg(sh[0] - 6, sh[1] + 2, p.aB[0], L.upper), hdB = seg(elB[0], elB[1], p.aB[1], L.fore);
      // Tiefster Fuß steht auf dem Boden (bzw. auf der Sprunghöhe)
      const hipY = -Math.max(footF[1], footB[1]) - p.lift;

      ctx.save();
      ctx.translate(sx, sy);
      ctx.scale(fd.face || 1, 1);
      const fall = fallAngle(fd.act, fd.actF);
      if (fall) ctx.rotate(-fall);
      ctx.translate(0, hipY);

      const dark = 0.7;
      // hintere Gliedmaßen
      limb(0, 0, kneeB[0], kneeB[1], 16, shade(ch.pants, dark));
      limb(kneeB[0], kneeB[1], footB[0], footB[1], 14, shade(ch.pants, dark));
      dot(footB[0] + 6, footB[1] + 2, 7, shade(ch.shoes, dark));
      limb(sh[0] - 6, sh[1] + 2, elB[0], elB[1], 13, shade(ch.shirt, dark));
      limb(elB[0], elB[1], hdB[0], hdB[1], 11, shade(ch.shirt, dark));
      dot(hdB[0], hdB[1], 9, shade(ch.gloves, dark));
      // Oberkörper (Hoodie)
      limb(0, 0, sh[0], sh[1] + 6, 40, ch.shirt);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sh[0] + 3, sh[1] + 10); ctx.lineTo(sh[0] * 0.5 + 4, sh[1] * 0.5 + 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sh[0] + 9, sh[1] + 10); ctx.lineTo(sh[0] * 0.5 + 10, sh[1] * 0.5 + 8); ctx.stroke();
      dot(0, 2, 15, ch.pants);
      // vordere Gliedmaßen
      limb(0, 0, kneeF[0], kneeF[1], 16, ch.pants);
      limb(kneeF[0], kneeF[1], footF[0], footF[1], 14, ch.pants);
      dot(footF[0] + 6, footF[1] + 2, 7, ch.shoes);

      // Kopf (wird nicht gespiegelt, damit Schriftzüge auf Caps lesbar bleiben)
      const img = headImgFor(pid);
      const headCx = sh[0] + p.tilt * 10, headBottom = sh[1] + 10;
      ctx.save();
      ctx.translate(headCx, headBottom);
      ctx.rotate(p.tilt * 0.6);
      ctx.scale(fd.face || 1, 1);
      if (img && img.complete && img.naturalWidth > 0) {
        const hh = L.head, hw = hh * img.naturalWidth / img.naturalHeight;
        ctx.drawImage(img, -hw / 2, -hh, hw, hh);
      } else {
        dot(0, -36, 30, '#f2c29b');
        ctx.fillStyle = '#111'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText((name[0] || '?').toUpperCase(), 0, -28);
      }
      ctx.restore();

      limb(sh[0], sh[1], elF[0], elF[1], 13, ch.shirt);
      limb(elF[0], elF[1], hdF[0], hdF[1], 11, ch.shirt);
      dot(hdF[0], hdF[1], 10, ch.gloves);
      ctx.restore();

      const topY = fall ? sy - 70 : sy + hipY + sh[1] - L.head - 4;
      drawLabel(fd, pid, isMe, topY);
    }

    const woundCanvas = document.createElement('canvas'); woundCanvas.width = 200; woundCanvas.height = 170;
    const wg = woundCanvas.getContext('2d');
    function drawSpriteFighter(fd, name, cfg) {
      let anim = fd.act, guard = 0;
      const ready = (n) => cfg.anims[n] && spriteImages[name][n] && spriteImages[name][n].complete && spriteImages[name][n].naturalWidth > 0;
      while (anim && !ready(anim) && guard++ < 6) anim = SPRITE_FALLBACK[anim];
      if (!anim || !ready(anim)) return false;
      const a = cfg.anims[anim], img = spriteImages[name][anim];
      const n = a.frames || 1, fw = img.naturalWidth / n, fh = img.naturalHeight;
      const f = Math.max(0, fd.actF);
      const mv = MOVES[fd.act];
      let fi;
      if (mv && a.peak != null) {
        // Angriff: bis zum Treffer-Frame ausholen, im aktiven Moment halten, dann zurück
        const pk = Math.min(n - 1, a.peak);
        if (f < mv.start) fi = Math.floor(f / mv.start * (pk + 1));
        else if (f < mv.start + mv.active || !mv.rec) fi = pk;
        else fi = pk + Math.floor((f - mv.start - mv.active) / mv.rec * (n - pk));
      } else if (fd.act === 'getup') {
        fi = Math.floor((1 - Math.min(1, f / 18)) * (n - 1)); // KO-Animation rückwärts = Aufstehen
      } else if (fd.act === 'kd') {
        fi = Math.floor(Math.min(1, f / 22) * (n - 1));
      } else {
        const tm = SPRITE_TIMING[anim] || { loop: 8 };
        if (tm.loop) {
          fi = Math.floor(f / (60 / tm.loop)) % n;
          if (fd.act === 'walkb') fi = n - 1 - fi;
        } else fi = Math.floor(Math.min(1, f / tm.dur) * (n - 1));
      }
      fi = Math.max(0, Math.min(n - 1, fi | 0));
      const dh = cfg.drawHeight || 230, scale = dh / fh, dw = fw * scale;
      const footPad = (cfg.footPad || 0) * scale;
      fd.scale = scale;
      // Einzelbild-Stand bekommt ein leichtes Wippen, damit es lebendig wirkt
      const bob = (n === 1 && fd.act === 'idle') ? Math.round(Math.sin(f * 0.12) * 1.5) * 2 : 0;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.translate(Math.round(fd.x), Math.round(GROUND - (fd.y || 0) + footPad + bob));
      ctx.scale(fd.face || 1, 1);
      // Frame + Wunden in einer Zwischenfläche zusammensetzen (Wunden nur auf der Figur selbst)
      if (woundCanvas.width !== fw || woundCanvas.height !== fh) { woundCanvas.width = fw; woundCanvas.height = fh; }
      wg.clearRect(0, 0, fw, fh);
      wg.drawImage(img, fi * fw, 0, fw, fh, 0, 0, fw, fh);
      const ws = wounds[fd.pid];
      if (ws && ws.length) {
        // nur dort malen, wo die Figur selbst Pixel hat (klebt also am Körper/Gesicht)
        wg.globalCompositeOperation = 'source-atop';
        const cols = ['rgba(92,4,4,0.92)', 'rgba(128,10,10,0.92)', 'rgba(165,18,18,0.9)'];
        for (const w of ws) {
          for (const [dx, dy, ci] of w.px) { wg.fillStyle = cols[ci]; wg.fillRect(w.x + dx, w.y + dy, 1, 1); }
          if (w.drip >= 1) { wg.fillStyle = cols[1]; wg.fillRect(w.x, w.y + 1, 1, Math.floor(w.drip)); }
        }
        wg.globalCompositeOperation = 'source-over';
      }
      if (fd.act === 'hit' && f < 8) ctx.filter = 'brightness(1.8) saturate(0.4)';
      ctx.drawImage(woundCanvas, 0, 0, fw, fh, -dw / 2, -dh, dw, dh);
      ctx.restore();
      return true;
    }

    function drawLabel(fd, pid, isMe, topY) {
      ctx.save();
      ctx.font = 'bold 15px "Baloo 2", sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = isMe ? '#ffd23f' : '#ffffff';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.fillText(isMe ? '▼ DU' : nameOf(pid), fd.x, topY);
      ctx.restore();
    }

    function drawProjectile(x, dir, kind, t) {
      const y = GROUND - 110;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);
      ctx.lineCap = 'round';
      if (kind === 'laser') {
        ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 20;
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-50, 0); ctx.lineTo(20, 0); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-50, 0); ctx.lineTo(20, 0); ctx.stroke();
      } else if (kind === 'fireball') {
        for (let i = 0; i < 6; i++) { ctx.fillStyle = `rgba(255,${120 + i * 20},0,${0.5 - i * 0.07})`; ctx.beginPath(); ctx.arc(-i * 9, Math.sin(t / 50 + i) * 4, 18 - i * 2, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(2, 0, 9, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.rotate(kind === 'laser' ? 0 : t / 60);
        if (kind === 'bottle') {
          ctx.fillStyle = '#5b3a1a'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.roundRect(-8, -14, 16, 26, 5); ctx.fill(); ctx.stroke();
          ctx.fillRect(-4, -24, 8, 11); ctx.strokeRect(-4, -24, 8, 11);
          ctx.fillStyle = '#e9d8a6'; ctx.fillRect(-7, -6, 14, 9);
        } else if (kind === 'cowbell') {
          ctx.fillStyle = '#d4a017'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(9, -14); ctx.lineTo(15, 13); ctx.lineTo(-15, 13); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 15, 4, 0, Math.PI * 2); ctx.fill();
        } else if (kind === 'wrench') {
          ctx.strokeStyle = '#111'; ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(16, 0); ctx.stroke();
          ctx.strokeStyle = '#b8c0c8'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(16, 0); ctx.stroke();
          ctx.fillStyle = '#b8c0c8'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(20, 0, 9, 0.6, Math.PI * 2 - 0.6); ctx.fill(); ctx.stroke();
        } else if (kind === 'mustache') {
          ctx.fillStyle = '#4a2c17'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-10, -12, -26, -8, -28, 6); ctx.bezierCurveTo(-18, 0, -8, 6, 0, 4);
          ctx.bezierCurveTo(8, 6, 18, 0, 28, 6); ctx.bezierCurveTo(26, -8, 10, -12, 0, 0);
          ctx.fill(); ctx.stroke();
        } else {
          ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 18;
          ctx.fillStyle = '#c084fc'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(3, -3, 6, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }

    function spawnSpark(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 18 + Math.random() * 12, color });
      }
      particles.push({ ring: true, x, y, r: 6, life: 12, color });
    }
    function stepParticles() {
      for (const p of particles) {
        p.life--;
        if (p.ring) p.r += 4; else { p.x += p.vx; p.y += p.vy; p.vy += 0.3; }
      }
      particles = particles.filter(p => p.life > 0);
    }
    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life / 12);
        if (p.ring) { ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke(); }
        else { ctx.fillStyle = p.color; ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); }
      }
      ctx.globalAlpha = 1;
    }

    // Angezeigte Lebensbalken laufen mit rotem "Nachzieh"-Balken hinterher
    const shownHp = {};
    let hudSecs = ROUND_SECONDS;
    function drawHud(t) {
      if (!meta || !meta.cur) return;
      const { p1, p2, w1, w2, rk } = meta.cur;
      const side = (pid, left, wins) => {
        const f = pid === playerId && my ? my : (remoteF[pid] && remoteF[pid].rk === rk ? remoteF[pid] : null);
        const hp = f ? f.hp : START_HP, en = f ? f.en : 0;
        const s = shownHp[pid] ??= { trail: hp };
        if (s.trail < hp) s.trail = hp; else s.trail = Math.max(hp, s.trail - 0.6);
        const bw = 380, bx = left ? 30 : W - 30 - bw, by = 22;
        ctx.fillStyle = '#111'; ctx.fillRect(bx - 4, by - 4, bw + 8, 30);
        ctx.fillStyle = '#5a0d0d'; ctx.fillRect(bx, by, bw, 22);
        ctx.fillStyle = '#ff4d4d';
        const tw = bw * s.trail / START_HP, hw = bw * hp / START_HP;
        if (left) ctx.fillRect(bx + bw - tw, by, tw, 22); else ctx.fillRect(bx, by, tw, 22);
        const grad = ctx.createLinearGradient(0, by, 0, by + 22);
        grad.addColorStop(0, '#fff176'); grad.addColorStop(1, '#f9a825');
        ctx.fillStyle = hp < 25 ? (Math.sin(t / 90) > 0 ? '#ff7043' : '#ffb300') : grad;
        if (left) ctx.fillRect(bx + bw - hw, by, hw, 22); else ctx.fillRect(bx, by, hw, 22);
        // Name & Kopf-Icon
        ctx.font = 'bold 18px "Baloo 2", sans-serif'; ctx.textAlign = left ? 'left' : 'right';
        ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
        ctx.fillText(nameOf(pid), left ? bx + 44 : bx + bw - 44, by + 48);
        ctx.shadowBlur = 0;
        const img = headImgFor(pid);
        if (img && img.complete && img.naturalWidth) {
          const ih = 40, iw = ih * img.naturalWidth / img.naturalHeight;
          ctx.drawImage(img, left ? bx - 2 : bx + bw - iw + 2, by + 28, iw, ih);
        }
        // Rundensiege
        for (let i = 0; i < WINS_NEEDED; i++) {
          const cx = left ? bx + bw - 12 - i * 22 : bx + 12 + i * 22;
          ctx.fillStyle = i < wins ? '#ffd23f' : 'rgba(255,255,255,0.2)';
          ctx.beginPath(); ctx.arc(cx, by + 42, 7, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
        }
        // Energie für den Super-Angriff
        const ew = 200, ex = left ? 30 : W - 30 - ew, ey = H - 26;
        ctx.fillStyle = '#111'; ctx.fillRect(ex - 3, ey - 3, ew + 6, 16);
        ctx.fillStyle = '#1e3a5f'; ctx.fillRect(ex, ey, ew, 10);
        ctx.fillStyle = f && f.sp ? (Math.sin(t / 80) > 0 ? '#38bdf8' : '#e0f2fe') : '#38bdf8';
        ctx.fillRect(left ? ex : ex + ew - ew * en / 100, ey, ew * en / 100, 10);
        ctx.font = 'bold 12px "Baloo 2", sans-serif'; ctx.fillStyle = '#e0f2fe'; ctx.textAlign = left ? 'left' : 'right';
        ctx.fillText(f && f.sp ? 'SUPERPOWER! (Doppelsprung)' : 'SUPERPOWER', left ? ex : ex + ew, ey - 6);
      };
      side(p1, true, w1 || 0);
      side(p2, false, w2 || 0);
      // Zeit
      let secs = ROUND_SECONDS;
      if (meta.phase === 'fight' && fightRk === rk && fightLocalStart) secs = hudSecs = Math.max(0, Math.ceil(ROUND_SECONDS - (performance.now() - fightLocalStart) / 1000));
      else if (meta.phase !== 'intro' && fightRk === rk) secs = hudSecs; // Zeit nach Rundenende einfrieren
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(W / 2 - 36, 14, 72, 52, 10); ctx.fill();
      ctx.font = 'bold 38px "Baloo 2", sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = secs <= 10 ? '#ff4d4d' : '#ffd23f';
      ctx.fillText(String(secs), W / 2, 56);
      ctx.font = 'bold 12px "Baloo 2", sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('RUNDE ' + meta.cur.rn, W / 2, 82);
    }

    function drawBanner(t) {
      if (!banner || t > banner.until) return;
      ctx.save();
      ctx.textAlign = 'center';
      const pop = Math.min(1, (banner.until - t) / 200);
      ctx.globalAlpha = pop;
      ctx.font = 'bold 76px "Baloo 2", sans-serif';
      ctx.lineWidth = 10; ctx.strokeStyle = '#111';
      ctx.strokeText(banner.text, W / 2, H / 2 - 20);
      ctx.fillStyle = banner.color; ctx.fillText(banner.text, W / 2, H / 2 - 20);
      if (banner.sub) {
        ctx.font = 'bold 26px "Baloo 2", sans-serif'; ctx.lineWidth = 6;
        ctx.strokeText(banner.sub, W / 2, H / 2 + 22); ctx.fillStyle = '#fff'; ctx.fillText(banner.sub, W / 2, H / 2 + 22);
      }
      ctx.restore();
    }

    let confetti = [];
    let returnStart = null, returnSecs = 0;
    function returnCountdownText() {
      if (!returnStart) return '';
      const left = Math.max(0, Math.ceil(returnSecs - (performance.now() - returnStart) / 1000));
      return 'Zurück ins Cockpit in ' + left + ' s';
    }
    function drawWaitingScreen(t) {
      if (meta && meta.phase === 'done') { drawCeremony(t); return; }
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      if (!meta || !league) { bigText('Liga wird geladen …', H / 2, '#ffd23f', 44); return; }
      if (meta.tooFew) { bigText('Zu wenig Kämpfer', H / 2 - 20, '#ffd23f', 44); smallText('Es braucht mindestens 2 Spieler (ohne Admin).', H / 2 + 22, '#fff', 22); return; }
      const st = leagueStage(league);
      const q = arr(meta.queue);
      if (meta.phase === 'sessionDone') {
        bigText('Für heute reicht\'s!', 70, '#ffd23f', 42);
        smallText(st === 'league' ? 'Beim nächsten Start geht die Liga weiter.' : st === 'playoff' ? 'Beim nächsten Start: Playoffs im Käfig!' : '', 104, '#fff', 20);
        drawMiniTable(150);
        smallText(returnCountdownText(), H - 24, '#ffd23f', 18);
        return;
      }
      const title = st === 'league' ? 'LIGA · JEDER GEGEN JEDEN' : st === 'playoff' ? 'PLAYOFFS IM KÄFIG' : 'LIGA BEENDET';
      bigText(title, 64, st === 'playoff' ? '#ff4d4d' : '#ffd23f', 40);
      const done = league.matches.filter(m => m.w).length;
      smallText(st === 'league' ? `Kampf ${done + 1} von ${league.matches.length} · heute ${q.length} Kämpfe` : st === 'done' ? 'Champion: ' + nameOf(league.champion) + ' · Admin kann eine neue Liga starten' : '', 96, '#fff', 20);
      // Heutige Kämpfe
      q.forEach((item, i) => {
        const pr = pairFor(item, league);
        const y = 150 + i * 46, isNext = i === (meta.qi == null ? -1 : meta.qi) + 1, past = i <= (meta.qi == null ? -1 : meta.qi);
        ctx.fillStyle = isNext ? 'rgba(255,210,63,0.18)' : 'rgba(255,255,255,0.06)';
        ctx.fillRect(W / 2 - 300, y - 30, 600, 40);
        if (isNext) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 300, y - 30, 600, 40); }
        drawPortrait(pr && pr.a, W / 2 - 290, y - 28, 36);
        drawPortrait(pr && pr.b, W / 2 + 254, y - 28, 36);
        smallText((item.k !== 'L' ? kindLabel(item.k, item.i) + ': ' : '') + (pr ? nameOf(pr.a) + '  vs  ' + nameOf(pr.b) : 'Sieger der Halbfinals'), y - 3, past ? 'rgba(255,255,255,0.4)' : '#fff', 22);
      });
      smallText(isDriver() ? 'Du startest den nächsten Kampf mit dem Knopf unten.' : 'Der Admin startet den nächsten Kampf.', H - 40, 'rgba(255,255,255,0.6)', 16);
    }
    function bigText(txt, y, color, size) {
      ctx.font = `bold ${size}px "Baloo 2", sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = 7; ctx.strokeStyle = '#111'; ctx.strokeText(txt, W / 2, y); ctx.fillStyle = color; ctx.fillText(txt, W / 2, y);
    }
    function smallText(txt, y, color, size) {
      ctx.font = `bold ${size}px "Baloo 2", sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.fillText(txt, W / 2, y);
    }
    function drawPortrait(pid, x, y, h) {
      const img = pid ? headImgFor(pid) : null;
      if (!img || !img.complete || !img.naturalWidth) return;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, x, y, h * img.naturalWidth / img.naturalHeight, h);
      ctx.imageSmoothingEnabled = true;
    }
    function drawMiniTable(y0) {
      const tab = standings(league).slice(0, 8);
      ctx.font = 'bold 16px "Baloo 2", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.textAlign = 'left';
      ctx.fillText('#   Kämpfer', W / 2 - 250, y0); ctx.textAlign = 'right';
      ctx.fillText('Kämpfe', W / 2 + 90, y0); ctx.fillText('Siege', W / 2 + 170, y0); ctx.fillText('Runden', W / 2 + 250, y0);
      tab.forEach((r, i) => {
        const y = y0 + 34 + i * 38;
        ctx.fillStyle = i < 4 ? 'rgba(255,210,63,0.12)' : 'rgba(255,255,255,0.05)'; ctx.fillRect(W / 2 - 260, y - 26, 520, 34);
        drawPortrait(r.id, W / 2 - 222, y - 25, 32);
        ctx.font = 'bold 20px "Baloo 2", sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
        ctx.fillText((i + 1) + '.', W / 2 - 250, y); ctx.fillText(nameOf(r.id), W / 2 - 180, y);
        ctx.textAlign = 'right';
        ctx.fillText(String(r.k), W / 2 + 90, y); ctx.fillStyle = '#7ed957'; ctx.fillText(String(r.s), W / 2 + 170, y);
        ctx.fillStyle = '#fff'; ctx.fillText(r.rp + ':' + r.rm, W / 2 + 250, y);
      });
    }
    function drawCeremony(t) {
      const champ = meta.champion || (league && league.champion);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
      // Konfetti in Pixel-Optik
      if (confetti.length < 160) confetti.push({ x: Math.random() * W, y: -10, vy: 1.5 + Math.random() * 2.5, vx: (Math.random() - 0.5) * 1.5, c: ['#ffd23f', '#ff2e93', '#38bdf8', '#7ed957', '#ffffff'][(Math.random() * 5) | 0] });
      for (const c of confetti) { c.x += c.vx; c.y += c.vy; if (c.y > H) { c.y = -10; c.x = Math.random() * W; } ctx.fillStyle = c.c; ctx.fillRect(Math.round(c.x / LO) * LO, Math.round(c.y / LO) * LO, LO * 2, LO); }
      if (!champ) { bigText('Turnier beendet', H / 2, '#ffd23f', 48); return; }
      // Champion: großes Pixel-Porträt im Goldrahmen + Siegerpose
      const img = headImgFor(champ);
      if (img && img.complete && img.naturalWidth) {
        const ih = 190, iw = ih * img.naturalWidth / img.naturalHeight, x = 150 - iw / 2, y = 150 + Math.sin(t / 300) * 4;
        ctx.fillStyle = '#b8860b'; ctx.fillRect(x - 12, y - 12, iw + 24, ih + 24);
        ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 8, y - 8, iw + 16, ih + 16);
        ctx.fillStyle = '#1a1030'; ctx.fillRect(x - 4, y - 4, iw + 8, ih + 8);
        ctx.imageSmoothingEnabled = false; ctx.drawImage(img, x, y, iw, ih); ctx.imageSmoothingEnabled = true;
      }
      const name = nameOf(champ), cfg = FIGHTER_SPRITES[name];
      if (cfg) {
        ctx.save(); ctx.translate(W / 2 + 60, GROUND); ctx.scale(1.3, 1.3); ctx.translate(-(W / 2 + 60), -GROUND);
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(W / 2 + 60, GROUND + 2, 50, 10, 0, 0, Math.PI * 2); ctx.fill();
        drawSpriteFighter({ x: W / 2 + 60, y: 0, face: -1, act: 'win', actF: t / (1000 / 60), pid: champ }, name, cfg);
        ctx.restore();
      }
      bigText('🏆 GRAND CHAMPION 🏆', 70, '#ffd23f', 50);
      bigText(name, 124, '#ffffff', 44);
      ctx.font = 'bold 20px "Baloo 2", sans-serif'; ctx.fillStyle = '#ffd23f'; ctx.textAlign = 'center';
      ctx.fillText('+' + CHAMPION_POINTS + ' Punkte', 150, 400);
      smallText(returnCountdownText(), H - 24, '#ffd23f', 18);
    }

    // =====================================================================================
    // HAUPTSCHLEIFE (feste 60 Schritte pro Sekunde, gezeichnet so oft der Bildschirm kann)
    // =====================================================================================
    let lastT = performance.now(), acc = 0;
    function frame(t) {
      acc += Math.min(200, t - lastT); lastT = t;
      while (acc >= 1000 / 60) {
        acc -= 1000 / 60;
        if (hitstop > 0) { hitstop--; continue; }
        if (my) { my.px = my.x; my.py = my.y; }
        stepMe();
        stepParticles();
        stepBlood();
        if (shake > 0) shake *= 0.85;
      }
      render(t);
      requestAnimationFrame(frame);
    }

    function render(t) {
      music.set(!meta || meta.phase === 'done' ? null : (isCage() ? 'cage' : 'harbor'));
      ctx.save();
      if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      drawStage(t);
      const inMatch = meta && meta.cur && ['intro', 'fight', 'roundEnd', 'matchEnd'].includes(meta.phase);
      if (inMatch) {
        const { p1, p2, rk } = meta.cur;
        for (const pid of [p1, p2]) {
          let fd;
          if (pid === playerId && my) {
            // eigene Figur zwischen den 60-Hz-Schritten interpolieren (flüssig auf 120/144-Hz-Monitoren)
            const al = Math.min(1, acc / (1000 / 60));
            const ix = my.px == null || Math.abs(my.x - my.px) > 40 ? my.x : my.px + (my.x - my.px) * al;
            const iy = my.py == null ? my.y : my.py + (my.y - my.py) * al;
            fd = { x: ix, y: Math.max(0, iy), face: my.face, act: my.act, actF: my.actF + al, cr: my.cr, bc: my.blockCr, sp: my.sp > 0, hp: my.hp };
          } else {
            const f = remoteF[pid], v = remoteVis[pid];
            if (f && v && f.rk === rk) {
              // ~70 ms in der Vergangenheit zeichnen und zwischen zwei empfangenen Positionen interpolieren
              const rt = t - 70, b = v.buf;
              let x = f.x, y = f.y;
              if (b.length) {
                if (rt <= b[0].t) { x = b[0].x; y = b[0].y; }
                else {
                  let i = b.length - 1;
                  while (i > 0 && b[i - 1].t > rt) i--;
                  if (i === b.length - 1 && rt >= b[i].t) { x = b[i].x; y = b[i].y; }
                  else { const a0 = b[i - 1] || b[i], a1 = b[i], k = a1.t > a0.t ? (rt - a0.t) / (a1.t - a0.t) : 1; x = a0.x + (a1.x - a0.x) * k; y = a0.y + (a1.y - a0.y) * k; }
                }
              }
              v.x = x; v.y = y;
              fd = { x, y: Math.max(0, y), face: f.face, act: f.act, actF: (t - v.actStart) / (1000 / 60), cr: f.cr, bc: f.bc, sp: !!f.sp, hp: f.hp };
            } else {
              fd = { x: pid === p1 ? 300 : 660, y: 0, face: pid === p1 ? 1 : -1, act: 'idle', actF: t / 16, cr: false };
            }
          }
          fd.pid = pid;
          drawFighter(fd, pid, pid === playerId);
          lastFd[pid] = fd;
        }
        // Geschosse
        if (myProj) drawProjectile(myProj.x, myProj.dir, charFor(myName).proj, t);
        for (const pid in remoteProj) {
          const p = remoteProj[pid];
          if (p.rk !== rk) continue;
          const x = p.x0 + p.dir * PROJ.speed * (t - p.seenAt) / (1000 / 60);
          if (x < -60 || x > W + 60) continue;
          drawProjectile(x, p.dir, charFor(nameOf(pid)).proj, t);
        }
        drawDrops();
        drawParticles();
        if (isCage()) drawCageForeground();
        drawHud(t);
      } else {
        drawWaitingScreen(t);
      }
      drawBanner(t);
      if ((soundOn || musicOn) && !audioReady()) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 190, H - 70, 380, 30);
        ctx.font = 'bold 16px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23f';
        ctx.fillText('🔊 Klick ins Spiel oder drück eine Taste für Sound', W / 2, H - 49);
      }
      ctx.restore();
    }

    // =====================================================================================
    // HTML-OBERFLÄCHE: Turnierbaum & Admin-Knöpfe
    // =====================================================================================
    function renderBracket() {
      const el = document.getElementById('bracket');
      if (!el) return;
      if (!league) { el.innerHTML = '<div class="text-white/50 text-sm">Liga wird geladen …</div>'; return; }
      const tab = standings(league);
      let html = '<table class="text-sm w-full max-w-xl"><tr class="text-white/50 text-xs"><td>#</td><td>Kämpfer</td><td class="text-right">Kämpfe</td><td class="text-right">Siege</td><td class="text-right">Niederl.</td><td class="text-right">Runden</td></tr>';
      tab.forEach((r, i) => {
        html += `<tr class="${i < 4 ? 'text-[#ffd23f]' : ''}"><td>${i + 1}.</td><td>${esc(nameOf(r.id))}</td><td class="text-right">${r.k}</td><td class="text-right">${r.s}</td><td class="text-right">${r.n}</td><td class="text-right">${r.rp}:${r.rm}</td></tr>`;
      });
      html += '</table>';
      const done = league.matches.filter(m => m.w).length;
      html += `<div class="text-xs text-white/50 mt-1">Liga: ${done} von ${league.matches.length} Kämpfen gespielt · Platz 1–4 kommen in die Playoffs (Käfig)</div>`;
      if (league.semis.length || league.final) {
        html += '<div class="mt-2 flex gap-3 flex-wrap">';
        league.semis.forEach((m, i) => html += `<div class="bracket-match">Halbfinale ${i + 1}: <span class="${m.w ? (m.w === m.a ? 'bracket-win' : 'bracket-lose') : ''}">${esc(nameOf(m.a))}</span> vs <span class="${m.w ? (m.w === m.b ? 'bracket-win' : 'bracket-lose') : ''}">${esc(nameOf(m.b))}</span></div>`);
        if (league.final) html += `<div class="bracket-match live">Grand Finale: ${esc(nameOf(league.final.a))} vs ${esc(nameOf(league.final.b))}${league.champion ? ' · 🏆 ' + esc(nameOf(league.champion)) : ''}</div>`;
        html += '</div>';
      }
      el.innerHTML = html;
    }
    // Übersicht für den Admin: was heute noch kommt und wie weit die Liga ist
    function renderAdminOverview() {
      const el = document.getElementById('admin-overview');
      if (!el) return;
      if (!isHost || !meta || !league) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      const q = arr(meta.queue), qi = meta.qi == null ? -1 : meta.qi;
      const live = meta.cur && ['intro', 'fight', 'roundEnd'].includes(meta.phase);
      const playedToday = Math.max(0, qi + (live ? 0 : 1));
      const leftToday = Math.max(0, q.length - playedToday);
      const total = league.matches.length, done = league.matches.filter(m => m.w).length, rem = total - done;
      const st = leagueStage(league);
      let lines = [];
      if (meta.phase === 'done' || meta.phase === 'sessionDone') lines.push('<b>Heute fertig</b> – gleich geht es automatisch zurück ins Cockpit.');
      else {
        const after = live ? q.length - (qi + 1) : leftToday;
        lines.push(`<b>Heute:</b> ${live ? 'Kampf ' + (qi + 1) + ' von ' + q.length + ' läuft · danach noch' : playedToday + ' von ' + q.length + ' Kämpfen gespielt · noch'} <b>${after}</b> ${after === 1 ? 'Kampf' : 'Kämpfe'} · nach dem letzten geht es automatisch zurück ins Cockpit`);
      }
      if (st === 'league') {
        const starts = Math.ceil(rem / FIGHTS_PER_START);
        lines.push(`<b>Liga:</b> ${done} von ${total} Kämpfen gespielt · noch <b>${rem}</b> (${starts} ${starts === 1 ? 'Start' : 'Starts'}) · danach 1 Start Playoffs im Käfig (${league.ids.length >= 4 ? '2 Halbfinale + Grand Finale' : 'Grand Finale'})`);
      } else if (st === 'playoff') {
        lines.push(`<b>Liga fertig</b> – jetzt Playoffs im Käfig: ${league.ids.length >= 4 ? '2 Halbfinale + Grand Finale' : 'Grand Finale'}`);
      } else if (st === 'done') {
        lines.push(`<b>Champion:</b> ${esc(nameOf(league.champion))} · beim nächsten Start beginnt automatisch eine neue Liga`);
      }
      el.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function updateUi() {
      const driver = isDriver();
      const nextBtn = document.getElementById('host-next-btn');
      const awardBox = document.getElementById('host-award-box');
      const phase = meta && meta.phase;
      const autoNext = phase === 'matchEnd' && meta && meta.cur && isLastFight(meta.cur);
      nextBtn.classList.toggle('hidden', !(driver && meta && league && !meta.tooFew && !autoNext && (phase === 'bracket' || phase === 'matchEnd')));
      renderAdminOverview();
      if (driver && meta && league) {
        const q = arr(meta.queue), qi = (meta.qi == null ? -1 : meta.qi) + 1;
        const pr = pairFor(q[qi], league);
        if (phase === 'matchEnd' && meta.cur && meta.cur.kind === 'F') nextBtn.innerText = '🏆 Siegerehrung';
        else if (pr) nextBtn.innerText = '▶ ' + (q[qi].k !== 'L' ? kindLabel(q[qi].k, q[qi].i) + ': ' : 'Nächster Kampf: ') + nameOf(pr.a) + ' vs ' + nameOf(pr.b);
        else nextBtn.innerText = '📋 Tabelle zeigen';
      }
      const resetBtn = document.getElementById('host-reset-btn');
      if (resetBtn) resetBtn.classList.toggle('hidden', !(isHost && meta && ['bracket', 'sessionDone', 'done'].includes(phase)));
      awardBox.classList.toggle('hidden', !(driver && meta && meta.cur && ['intro', 'fight'].includes(phase)));
      if (driver && meta && meta.cur) {
        document.getElementById('award-1').innerText = '🏳️ ' + nameOf(meta.cur.p1) + ' gewinnt';
        document.getElementById('award-2').innerText = '🏳️ ' + nameOf(meta.cur.p2) + ' gewinnt';
      }
      const role = document.getElementById('my-role');
      if (amFighting()) role.innerHTML = '🥊 <b>Du kämpfst!</b> ' + (charFor(myName).special ? 'Dein Spezialangriff: <b>' + esc(charFor(myName).special) + '</b>' : '');
      else role.innerText = isHost ? '🎬 Du leitest das Turnier.' : '👀 Du schaust zu - feuere die Kämpfer an!';
    }

    let playersLoaded = false;
    window.onload = function() {
      if (!playerId) return;
      get(ref(db, 'players/')).then((allSnap) => {
        allPlayers = allSnap.val() || {};
        playersLoaded = true;
        const data = allPlayers[playerId];
        myName = (data && data.name) || 'Kämpfer';
        if (data && data.name && (data.name.includes("Host") || data.name.includes("Admin"))) {
          isHost = true;
          document.getElementById("host-end-btn").classList.remove("hidden");
        }
        return get(ref(db, FS + '/meta'));
      }).then((snap) => {
        if (!snap.val() && isDriver()) driverCreateSession();
        // Nach einem Neuladen mitten im Kampf: eigenen Zustand wiederherstellen
        if (meta && meta.cur && amFighting() && ['intro', 'fight'].includes(meta.phase)) {
          get(ref(db, FS + '/f/' + playerId)).then((s) => {
            resetMyFighter(meta.cur.rk);
            const old = s.val();
            if (old && old.rk === meta.cur.rk) { my.hp = old.hp; my.x = old.x; my.en = old.en || 0; writeMe(true); }
            if (meta.phase === 'fight') { fightLocalStart = performance.now(); fightRk = meta.cur.rk; }
          });
        }
        updateUi(); renderBracket();
      });
      updateSoundButtons();
      requestAnimationFrame(frame);
    };
  </script>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-start p-3 select-none">

  <button id="host-end-btn" onclick="hostEndFighter()" class="hidden fixed bottom-4 right-4 z-30 py-3 px-4 jax-btn bg-[#ff2e93] text-white font-bold text-sm">
    Spiel beenden &amp; zurück ins Cockpit
  </button>

  <div class="w-full max-w-5xl text-center">
    <h1 class="text-2xl md:text-4xl font-extrabold text-[#ffd23f] mb-1" style="text-shadow: 3px 3px 0 #1a0b2e, -3px -3px 0 #1a0b2e, 3px -3px 0 #1a0b2e, -3px 3px 0 #1a0b2e;">
      🥊 Hirnschmalz-Fighter 🥊
    </h1>
    <div id="my-role" class="text-sm text-white/80 mb-2"></div>
    <div class="flex gap-2 justify-center mb-2">
      <button id="btn-sound" onclick="toggleSound()" class="py-1 px-3 jax-btn bg-white/90 text-[#1a1a2e] font-bold text-xs">🔊 Effekte & Ansager an</button>
      <button id="btn-music" onclick="toggleMusic()" class="py-1 px-3 jax-btn bg-white/90 text-[#1a1a2e] font-bold text-xs">🎵 Musik an</button>
    </div>
    <div id="admin-overview" class="hidden text-left text-sm bg-white/10 border-2 border-[#ffd23f]/60 rounded-xl px-3 py-2 mb-2 leading-6"></div>

    <canvas id="fight-canvas" width="960" height="540"></canvas>

    <div class="flex flex-wrap gap-2 justify-center mt-3">
      <button id="host-next-btn" onclick="hostNextFight()" class="hidden py-3 px-5 jax-btn bg-[#7ed957] text-[#0b2a0b] font-extrabold text-lg">▶ Nächster Kampf</button>
      <button id="host-reset-btn" onclick="hostResetLeague()" class="hidden py-2 px-3 jax-btn bg-white/90 text-[#1a1a2e] font-bold text-xs">🔄 Neue Liga</button>
      <div id="host-award-box" class="hidden flex gap-2 items-center">
        <span class="text-xs text-white/50">Notfall (Spieler weg?):</span>
        <button id="award-1" onclick="hostAward(1)" class="py-1.5 px-3 jax-btn bg-white/90 text-[#1a1a2e] font-bold text-xs">P1 gewinnt</button>
        <button id="award-2" onclick="hostAward(2)" class="py-1.5 px-3 jax-btn bg-white/90 text-[#1a1a2e] font-bold text-xs">P2 gewinnt</button>
      </div>
    </div>

    <div class="mt-3 text-xs md:text-sm text-white/75 leading-7">
      <span class="key">←</span><span class="key">→</span> laufen ·
      <span class="key">↓</span> ducken ·
      <span class="key">Leertaste</span> springen ·
      <span class="key">Strg</span> Schlag ·
      <span class="key">Y</span> Tritt ·
      <span class="key">Strg</span>+<span class="key">Y</span> Spezialangriff ·
      zurück halten = blocken
      <div class="text-white/50">Volle Energie = 10 Sek. Superpower (Doppelsprung, härtere Treffer) · ↓+Y ist ein Feger · A/D/S gehen auch, statt Y auch X</div>
    </div>

    <div class="mt-4 text-left">
      <div class="text-sm font-bold text-white/70 mb-1">Ligatabelle</div>
      <div id="bracket" class="flex gap-4 overflow-x-auto pb-2"></div>
    </div>
  </div>
</body>
</html>
