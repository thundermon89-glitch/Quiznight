<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0f54"/>
      <stop offset="35%" stop-color="#7017c9"/>
      <stop offset="70%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="blurBlob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="dropshadowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- HINTERGRUND -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- SCHWEBENDE FARBKLECKSE -->
  <circle cx="120" cy="120" r="180" fill="#ff2e93" opacity="0.45" filter="url(#blurBlob)"/>
  <circle cx="1080" cy="560" r="220" fill="#7017c9" opacity="0.5" filter="url(#blurBlob)"/>
  <circle cx="1000" cy="90" r="140" fill="#ff8a3d" opacity="0.4" filter="url(#blurBlob)"/>
  <circle cx="90" cy="580" r="150" fill="#3ecbff" opacity="0.35" filter="url(#blurBlob)"/>

  <!-- LEICHTES RASTER FÜR TIEFE -->
  <g opacity="0.06">
    <path d="M0 168 H1200 M0 337 H1200 M0 506 H1200" stroke="#ffffff" stroke-width="2"/>
    <path d="M300 0 V675 M600 0 V675 M900 0 V675" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- DEKO-STICKER: WÜRFEL OBEN LINKS -->
  <g transform="translate(120,150) rotate(-14)" filter="url(#dropshadowSmall)">
    <rect x="-45" y="-45" width="90" height="90" rx="18" fill="#ffd23f" stroke="#1a1a2e" stroke-width="6"/>
    <circle cx="-18" cy="-18" r="7" fill="#1a1a2e"/>
    <circle cx="18" cy="-18" r="7" fill="#1a1a2e"/>
    <circle cx="-18" cy="18" r="7" fill="#1a1a2e"/>
    <circle cx="18" cy="18" r="7" fill="#1a1a2e"/>
    <circle cx="0" cy="0" r="7" fill="#1a1a2e"/>
  </g>

  <!-- DEKO-STICKER: BUZZER OBEN RECHTS -->
  <g transform="translate(1075,145) rotate(10)" filter="url(#dropshadowSmall)">
    <circle cx="0" cy="0" r="50" fill="#ff2e93" stroke="#1a1a2e" stroke-width="6"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- DEKO-STICKER: POKAL UNTEN LINKS -->
  <g transform="translate(150,545) rotate(-8)" filter="url(#dropshadowSmall)">
    <rect x="-46" y="-46" width="92" height="92" rx="22" fill="#3ecbff" stroke="#1a1a2e" stroke-width="6"/>
    <g transform="translate(-16,-16) scale(1.5)" fill="none" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/>
      <path d="M5 5H3v2a4 4 0 0 0 4 4M19 5h2v2a4 4 0 0 1-4 4"/>
      <path d="M12 12v4"/>
      <path d="M8 20h8"/>
      <path d="M9 20v-2h6v2"/>
    </g>
  </g>

  <!-- DEKO-STICKER: FRAGEZEICHEN UNTEN RECHTS -->
  <g transform="translate(1060,535) rotate(12)" filter="url(#dropshadowSmall)">
    <rect x="-46" y="-46" width="92" height="92" rx="22" fill="#7ed957" stroke="#1a1a2e" stroke-width="6"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#1a1a2e">?</text>
  </g>

  <!-- HAUPT-TITEL -->
  <g filter="url(#dropshadow)">
    <text x="600" y="330" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
      font-size="128" letter-spacing="4" fill="#ffffff" stroke="#1a1a2e" stroke-width="8" paint-order="stroke">
      QUIZ
    </text>
    <text x="600" y="450" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
      font-size="128" letter-spacing="4" fill="#ffd23f" stroke="#1a1a2e" stroke-width="8" paint-order="stroke">
      NACHT
    </text>
  </g>

  <!-- UNTERTITEL-BADGE -->
  <g transform="translate(600,505)" filter="url(#dropshadowSmall)">
    <rect x="-260" y="-28" width="520" height="56" rx="28" fill="#1a1a2e" stroke="#ffffff" stroke-width="4"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="2" fill="#ffffff">
      8 SPIELE - 1 ABEND - UNENDLICH CHAOS
    </text>
  </g>

  <!-- KLEINE SPIELER-FIGUREN AM UNTEREN RAND -->
  <g transform="translate(390,610)">
    <circle r="22" fill="#ff2e93" stroke="#1a1a2e" stroke-width="5"/>
  </g>
  <g transform="translate(450,618)">
    <circle r="22" fill="#3ecbff" stroke="#1a1a2e" stroke-width="5"/>
  </g>
  <g transform="translate(750,618)">
    <circle r="22" fill="#7ed957" stroke="#1a1a2e" stroke-width="5"/>
  </g>
  <g transform="translate(810,610)">
    <circle r="22" fill="#ffd23f" stroke="#1a1a2e" stroke-width="5"/>
  </g>
</svg>
