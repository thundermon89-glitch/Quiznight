<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirnschmalz-Arena - Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-jax { font-family: 'Baloo 2', sans-serif; }

    .jax-bg {
      background: linear-gradient(120deg, #2b0f54, #7017c9, #ff2e93, #ff8a3d);
      background-size: 300% 300%;
      animation: gradientShift 16s ease infinite;
    }
    @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .blob { position: absolute; border-radius: 9999px; filter: blur(50px); opacity: 0.45; animation: floaty 11s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translate(0,0); } 50% { transform: translate(25px,-35px); } }

    .jax-card {
      background: #ffffff;
      border: 4px solid #1a1a2e;
      border-radius: 26px;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.85);
    }
    .jax-card-dark {
      background: #1a1a2e;
      border: 4px solid #ffffff;
      border-radius: 26px;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
      color: #ffffff;
    }
    .jax-chip {
      border: 3px solid #1a1a2e;
      border-radius: 9999px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.85);
    }
    .jax-btn {
      font-family: 'Baloo 2', sans-serif;
      border: 3px solid #1a1a2e;
      border-radius: 9999px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.85);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .jax-btn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(0,0,0,0.85); }
    .jax-btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 rgba(0,0,0,0.85); }

    @keyframes wiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
    .jax-wiggle { animation: wiggle 0.7s ease-in-out infinite; }

    @keyframes bounceIn { 0% { transform: scale(0.4); opacity: 0; } 65% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    .jax-pop { animation: bounceIn 0.5s cubic-bezier(.34,1.56,.64,1); }

    /* Avatar-Bonus: 360° links, schütteln, 360° rechts zurück - alles in einer Animation */
    @keyframes avatarBonusSpin {
      0%   { transform: rotate(0deg); }
      28%  { transform: rotate(-360deg); }
      36%  { transform: rotate(-360deg) translateX(-9px); }
      44%  { transform: rotate(-360deg) translateX(9px); }
      52%  { transform: rotate(-360deg) translateX(-7px); }
      60%  { transform: rotate(-360deg) translateX(7px); }
      68%  { transform: rotate(-360deg) translateX(0); }
      100% { transform: rotate(0deg); }
    }
    .avatar-bonus-spin { animation: avatarBonusSpin 1.7s ease-in-out; cursor: pointer; }
    .avatar-clickable { cursor: pointer; transition: transform .15s ease; }
    .avatar-clickable:hover { transform: scale(1.05); }
    @keyframes floatUpFade {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      20% { transform: translateY(-6px) scale(1.15); opacity: 1; }
      100% { transform: translateY(-70px) scale(1); opacity: 0; }
    }
    .avatar-bonus-popup { animation: floatUpFade 1.6s ease-out forwards; }

    @keyframes chestBounce {
      0% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.3) rotate(-18deg); }
      35% { transform: scale(1.4) rotate(150deg); }
      55% { transform: scale(1.35) rotate(210deg); }
      75% { transform: scale(1.45) rotate(345deg); }
      90% { transform: scale(1.1) rotate(370deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .chest-bounce { animation: chestBounce 1.3s cubic-bezier(.36,.07,.19,.97); }

    @keyframes chestVibrate {
      0%, 100% { transform: translateX(0) rotate(0); }
      10% { transform: translateX(-4px) rotate(-4deg); }
      20% { transform: translateX(4px) rotate(4deg); }
      30% { transform: translateX(-5px) rotate(-5deg); }
      40% { transform: translateX(5px) rotate(5deg); }
      50% { transform: translateX(-4px) rotate(-4deg); }
      60% { transform: translateX(4px) rotate(4deg); }
      70% { transform: translateX(-3px) rotate(-3deg); }
      80% { transform: translateX(3px) rotate(3deg); }
      90% { transform: translateX(-1px) rotate(-1deg); }
    }
    .chest-vibrate { animation: chestVibrate 0.4s ease-in-out; }
    .chest-clickable { cursor: pointer; }
    .chest-clickable:hover { filter: brightness(1.1); }

    @keyframes coinFly {
      0% { transform: translateY(40px) scale(0.4); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(-70px) scale(1.1); opacity: 0; }
    }
    .chest-coin { position: absolute; bottom: 0; pointer-events: none; animation: coinFly 1.1s ease-out forwards; }

    .wheel-outer { position: relative; width: 250px; height: 250px; margin: 0 auto; }
    .wheel-pointer { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); z-index: 5; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
    .wheel-disc { width: 250px; height: 250px; border-radius: 50%; position: relative; border: 6px solid #1a1a2e; box-shadow: 10px 10px 0 rgba(0,0,0,0.5); }
    .wheel-label {
      position: absolute; top: 50%; left: 50%; width: 92px; margin-left: -46px; margin-top: -9px;
      text-align: center; font-size: 11px; font-weight: 800; color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9); pointer-events: none; font-family: 'Baloo 2', sans-serif;
    }
    .wheel-center-dot { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; background: #ffd23f; border: 3px solid #1a1a2e; z-index: 4; }
    .spin-on-hover { transition: transform 0.8s ease; }
    .spin-on-hover:hover { transform: rotate(360deg); }

    /* ==== RAD-DES-WAHNSINNS ERGEBNIS: großer bunter Sticker-Look statt kleinem SVG-Icon ==== */
    @keyframes stickerPop {
      0% { transform: scale(0) rotate(-25deg); opacity: 0; }
      60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
      80% { transform: scale(0.95) rotate(-4deg); }
      100% { transform: scale(1) rotate(-6deg); opacity: 1; }
    }
    .wheel-sticker {
      width: 130px; height: 130px; margin: 0 auto;
      background: radial-gradient(circle at 35% 30%, #ffe680, #ffd23f 60%, #ff9f1c 100%);
      border: 5px solid #1a1a2e; border-radius: 50%;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.85), inset 0 0 0 4px rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      animation: stickerPop 0.6s cubic-bezier(.34,1.56,.64,1);
    }
    .wheel-sticker-emoji { font-size: 64px; line-height: 1; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.25)); }

      @keyframes brainHop {
      0% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-24px) scale(1.12); }
      55% { transform: translateY(0) scale(0.94); }
      75% { transform: translateY(-9px) scale(1.04); }
      100% { transform: translateY(0) scale(1); }
    }
    .brain-hop { animation: brainHop 0.4s ease-out; }

    @keyframes brainFlyAway {
      0% { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(50px, -180px) scale(0.15) rotate(35deg); opacity: 0; }
    }
    .brain-fly-away { animation: brainFlyAway 0.7s ease-in forwards; }

    @keyframes brainBubblePop {
      0% { transform: translateY(6px) scale(0.6); opacity: 0; }
      20% { transform: translateY(0) scale(1.05); opacity: 1; }
      80% { transform: translateY(-2px) scale(1); opacity: 1; }
      100% { transform: translateY(-12px) scale(0.9); opacity: 0; }
    }
    .brain-bubble {
      position: fixed; z-index: 40; pointer-events: none;
      background: white; color: #1a1a2e; border: 2px solid #1a1a2e;
      border-radius: 10px; padding: 4px 9px; font-size: 11px; font-weight: 800;
      font-family: 'Baloo 2', sans-serif;
      animation: brainBubblePop 1.4s ease-out forwards;
      white-space: nowrap;
    }
    .brain-bubble-success {
      background: #16a34a; color: white; border-color: #14532d; font-size: 14px;
      padding: 6px 14px;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ==== EIGENES ICON-SET (keine Emojis - schlichte, dicke Outline-SVGs) ====
    const ICONS = {
      bell: '<path d="M12 3a5 5 0 0 0-5 5v3.5c0 .8-.3 1.6-.9 2.2L4 16h16l-2.1-2.3a3 3 0 0 1-.9-2.2V8a5 5 0 0 0-5-5z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/>',
      check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
      chest: '<rect x="3" y="10" width="18" height="9" rx="2"/><path d="M3 10a9 5 0 0 1 18 0"/><circle cx="12" cy="14" r="1.6"/>',
      crystal: '<circle cx="12" cy="10" r="6"/><path d="M6 19h12"/><path d="M9 19c0-2 1-3 3-3s3 1 3 3"/>',
      star: '<path d="M12 3l2.4 5.1 5.6.6-4.2 3.8 1.2 5.5L12 15.8 6.9 18l1.3-5.5-4.2-3.8 5.6-.6z"/>',
      mute: '<path d="M4 5h13a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2l-4 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M8 10l4 4M12 10l-4 4"/>',
      wheel: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l7.8 3"/>',
      trophy: '<path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/><path d="M5 5H3v2a4 4 0 0 0 4 4M19 5h2v2a4 4 0 0 1-4 4"/><path d="M12 12v4"/><path d="M8 20h8"/><path d="M9 20v-2h6v2"/>',
      skull: '<path d="M12 3a7 7 0 0 0-7 7v3l-1 2h4l1 3h6l1-3h4l-1-2v-3a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="11" r="1.2"/><circle cx="14.5" cy="11" r="1.2"/>',
      mask: '<path d="M2 10c2-2 5-3 10-3s8 1 10 3c-1 3-3 6-10 6S3 13 2 10z"/><circle cx="7.5" cy="10" r="1.3"/><circle cx="16.5" cy="10" r="1.3"/>',
      burst: '<path d="M12 2l1.5 5.5L19 6l-3 4.5L21 13l-5.5 1L17 20l-5-3.5L7 20l1.5-6L3 13l5-2.5L5 6l5.5 1.5z"/>',
      trendDown: '<path d="M4 7l7 7 4-4 5 5"/><path d="M14 15h6v-6"/>',
      crown: '<path d="M4 18h16l1-9-5 3-4-6-4 6-5-3z"/>',
      spy: '<circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/>',
      exit: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8"/><path d="M14 12h7m0 0l-3-3m3 3l-3 3"/>',
      pointer: '<path d="M12 4l7 12H5z"/>',
      chart: '<path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/>'
    };
    function icon(name, cls) {
      return `<svg class="${cls || 'w-5 h-5'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
    }

    const firebaseConfig = {
      databaseURL: "https://play-ground-82b46-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let playerId = localStorage.getItem("quiz_player_id");
    if (!playerId) {
      window.location.href = "index.html"; // Zurück zur Lobby, wenn keine ID da ist
    }

    let lastSeenChaosRolledAt = null;
    let allPlayersCache = {};

    // ==== RAD DES WAHNSINNS: keine Runden, keine Verpflichtungen. Ein Dreh des Hosts löst
    // sofort eine Punkte-Umverteilung aus - alles ist in diesem einen Moment erledigt. ====
    const WHEEL_EFFECTS = [
      { id: 'e1', icon: 'burst', emoji: '🎉', title: 'Punkte-Dusche' },
      { id: 'e2', icon: 'crown', emoji: '🏹', title: 'Robin Hood' },
      { id: 'e3', icon: 'wheel', emoji: '🔄', title: 'Tausch-Rausch' },
      { id: 'e4', icon: 'star', emoji: '🍀', title: 'Zufalls-Bonus' },
      { id: 'e5', icon: 'trendDown', emoji: '💸', title: 'Zufalls-Abzug' },
      { id: 'e6', icon: 'crystal', emoji: '⚖️', title: 'Gleichmacherei' },
      { id: 'e7', icon: 'mask', emoji: '🥷', title: 'Punkteklau' },
      { id: 'e8', icon: 'skull', emoji: '😅', title: 'Fehlalarm' },
      { id: 'e9', icon: 'chart', emoji: '📊', title: 'Platzierungs-Check' }
    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function getActiveIds(players) {
      return Object.keys(players).filter(id => players[id] && players[id].name && !players[id].name.includes("Host") && !players[id].name.includes("Admin"));
    }

    window.toggleReadyStatus = function() {
      get(ref(db, 'players/' + playerId)).then((snapshot) => {
        if (snapshot.exists()) {
          const currentReady = snapshot.val().isReady || false;
          const updates = { isReady: !currentReady };
          // Sperre gegen Mehrfachbestrafung aufheben, sobald man sich (wieder) bereit meldet
          if (!currentReady) updates.latePenaltyGiven = false;
          update(ref(db, 'players/' + playerId), updates);
        }
      });
    };

    window.closeChaosModal = () => document.getElementById("chaos-card-modal").classList.add("hidden");

    // Rad-Zustand beobachten: Dreh-Animation für alle zeigen, sobald der Host gedreht hat.
    // Der "bereits gesehen"-Status wird direkt am eigenen Spielerdatensatz in Firebase
    // gespeichert (nicht im Browser) - das ist zuverlässig, egal wie/wo gehostet wird,
    // und übersteht jedes Neuladen der Seite garantiert.
    onValue(ref(db, 'wheelState'), (snapshot) => {
      const ws = snapshot.val();
      if (!ws || !ws.effectId || !ws.rolledAt) return;
      // Nur reagieren, wenn der Wurf wirklich gerade eben passiert ist - sonst würde ein frisch
      // beitretender Spieler (der noch keinen "schon gesehen"-Eintrag hat) einen alten, längst
      // vergangenen Radwurf aus einer früheren Session fälschlich als "neu" angezeigt bekommen.
      if (Date.now() - ws.rolledAt > 20000) return;

      get(ref(db, 'players/' + playerId + '/lastSeenWheelAt')).then((seenSnap) => {
        if (seenSnap.val() === ws.rolledAt) return; // schon gesehen
        update(ref(db, 'players/' + playerId), { lastSeenWheelAt: ws.rolledAt });
        showWheelSpin(ws);
      });
    });

    // Verschlafen-Strafe beobachten: sobald jemand nicht rechtzeitig bereit war, sehen das
    // ALLE Spieler in einem Popup - nicht nur der Host.
    onValue(ref(db, 'gameState/latePenaltyEvent'), (snapshot) => {
      const ev = snapshot.val();
      if (!ev || !ev.at || !ev.names || ev.names.length === 0) return;
      if (Date.now() - ev.at > 20000) return; // nur wirklich frische Ereignisse anzeigen

      get(ref(db, 'players/' + playerId + '/lastSeenLatePenaltyAt')).then((seenSnap) => {
        if (seenSnap.val() === ev.at) return; // schon gesehen
        update(ref(db, 'players/' + playerId), { lastSeenLatePenaltyAt: ev.at });
        showLatePenaltyPopup(ev);
      });
    });

    function showLatePenaltyPopup(ev) {
      const modal = document.getElementById('late-penalty-modal');
      const textEl = document.getElementById('late-penalty-text');
      if (!modal || !textEl) return;
      const names = ev.names;
      const namesJoined = names.length > 1
        ? names.slice(0, -1).join(', ') + ' und ' + names[names.length - 1]
        : names[0];
      const perPerson = names.length > 1 ? ' pro Person' : '';
      textEl.innerHTML = `Warum starten wir das Spiel denn nicht?<br>Besonderer Dank geht an <b class="text-[#ff2e93]">${namesJoined}</b>.<br>Die Kosten für diese Wartezeit betragen derzeit <b>${ev.amount} Punkte</b>${perPerson}.`;
      modal.classList.remove('hidden');
    }
    window.closeLatePenaltyModal = () => document.getElementById('late-penalty-modal')?.classList.add('hidden');

    function showWheelSpin(ws) {
      const modal = document.getElementById("chaos-card-modal");
      const introEl = document.getElementById("chaos-roll-intro");
      const wheelEl = document.getElementById("chaos-wheel-container");
      const resultEl = document.getElementById("chaos-card-result");
      const continueBox = document.getElementById("chaos-modal-continue");

      const labels = WHEEL_EFFECTS.map(e => e.title);
      const targetIdx = WHEEL_EFFECTS.findIndex(e => e.id === ws.effectId);

      modal.classList.remove("hidden");
      resultEl.classList.add("hidden");
      continueBox.classList.add("hidden");
      wheelEl.classList.remove("hidden");
      introEl.classList.remove("hidden");
      introEl.innerHTML = `${icon('wheel', 'w-5 h-5 inline -mt-1')} Das Rad des Wahnsinns entscheidet...`;

      spinWheel(wheelEl, labels, targetIdx, () => {
        const effect = WHEEL_EFFECTS[targetIdx];
        wheelEl.classList.add("hidden");
        resultEl.classList.remove("hidden");
        resultEl.innerHTML = effect ? `
          <div class="wheel-sticker">
            <span class="wheel-sticker-emoji">${effect.emoji || '🎲'}</span>
          </div>
          <div class="text-xl font-jax font-extrabold text-[#7017c9] mb-2 mt-3">${effect.title}</div>
          <div class="text-sm text-[#1a1a2e]/80">${ws.description || ''}</div>
        ` : '';
        continueBox.classList.remove("hidden");
        continueBox.innerHTML = finalContinueButtonHtml();
      });
    }

    function finalContinueButtonHtml() {
      return `<button onclick="closeChaosModal()" class="w-full py-3 jax-btn bg-[#ffd23f] text-[#1a1a2e] font-jax font-bold text-sm">Verstanden</button>`;
    }

    // ---- Drehrad: dreht sich klickernd und bleibt auf einem vorbestimmten Namen stehen ----
    let wheelAudioCtx = null;
    document.addEventListener('click', () => {
      if (!wheelAudioCtx) wheelAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (wheelAudioCtx.state === 'suspended') wheelAudioCtx.resume();
    }, { once: true });

    function playWheelTick() {
      try {
        if (!wheelAudioCtx) return;
        const osc = wheelAudioCtx.createOscillator();
        const gain = wheelAudioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 1400;
        gain.gain.setValueAtTime(0.18, wheelAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, wheelAudioCtx.currentTime + 0.05);
        osc.connect(gain).connect(wheelAudioCtx.destination);
        osc.start();
        osc.stop(wheelAudioCtx.currentTime + 0.06);
      } catch (e) {}
    }

    function scheduleWheelTicks(durationMs, segmentCount) {
      const totalTicks = Math.max(18, segmentCount * 6);
      for (let k = 1; k <= totalTicks; k++) {
        const t = durationMs * Math.pow(k / totalTicks, 2.1); // wird zum Ende hin langsamer
        setTimeout(playWheelTick, t);
      }
    }

    function spinWheel(containerEl, labels, targetIndex, onDone) {
      const n = labels.length;
      const segAngle = 360 / n;
      const colors = ['#ff2e93', '#7017c9', '#ffd23f', '#3ecbff', '#7ed957', '#ff8a3d'];
      const stops = labels.map((_, i) => `${colors[i % colors.length]} ${i * segAngle}deg ${(i + 1) * segAngle}deg`).join(', ');
      containerEl.innerHTML = `
        <div class="wheel-outer">
          <div class="wheel-pointer text-amber-400">${icon('pointer', 'w-9 h-9')}</div>
          <div class="wheel-disc" id="wheel-disc-el" style="background: conic-gradient(${stops});">
            ${labels.map((label, i) => {
              const mid = i * segAngle + segAngle / 2;
              return `<div class="wheel-label" style="transform: rotate(${mid}deg) translateY(-102px) rotate(${-mid}deg);">${label}</div>`;
            }).join('')}
          </div>
          <div class="wheel-center-dot"></div>
        </div>
      `;
      const disc = document.getElementById('wheel-disc-el');
      const durationMs = 8000;
      const spins = 7;
      const targetMid = targetIndex * segAngle + segAngle / 2;
      const finalAngle = spins * 360 + (360 - targetMid);

      scheduleWheelTicks(durationMs, n);
      disc.style.transition = `transform ${durationMs}ms cubic-bezier(0.08, 0.55, 0.1, 1)`;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { disc.style.transform = `rotate(${finalAngle}deg)`; });
      });
      setTimeout(onDone, durationMs + 300);
    }

    // ---- Truhen-Animation: Kiste wackelt & dreht sich, Konfetti schießt heraus ----
    function playChestOpenAnimation() {
      const chestIcon = document.getElementById("chest-icon");
      if (!chestIcon) return;

      // Hinweis-Anzeige nicht mehr nötig hier - die Sprechblase übernimmt das jetzt direkt.

      chestIcon.classList.remove("chest-bounce");
      void chestIcon.offsetWidth; // Reflow erzwingen, damit die Animation neu startet
      chestIcon.classList.add("chest-bounce");

      setTimeout(fireChestConfetti, 350);
      setTimeout(showChestSpeechBubble, 950);
    }

    // Holt den Hinweis per direktem, einmaligem Firebase-Abruf (unabhängig vom
    // players-Listener) und zeigt ihn in einer schließbaren Sprechblase neben der Truhe.
    // Solange die Sprechblase offen ist, zeigt die Truhe das "geöffnet"-Bild.
    const CHEST_CLOSED_IMG = "https://github.com/thundermon89-glitch/Quiznight/raw/main/Kistegeschlosssencockpit.jpg";
    const CHEST_OPEN_IMG = "https://github.com/thundermon89-glitch/Quiznight/raw/2a2930cac0bce37a87e795cadf82de3b8de84ee5/Kistege%C3%B6ffnetcockpit.jpg";

    function showChestSpeechBubble() {
      get(ref(db, 'players/' + playerId + '/riddleClues')).then((snap) => {
        let clues = snap.val();
        if (!clues) clues = [];
        else if (!Array.isArray(clues)) clues = Object.values(clues);

        const bubble = document.getElementById('chest-speech-bubble');
        const content = document.getElementById('chest-speech-content');
        if (!bubble || !content) return;

        if (clues.length === 0) {
          content.innerHTML = `<div class="italic text-[#1a1a2e]/50">Noch keine Hinweise für dich - versuch's nach der nächsten Runde nochmal!</div>`;
        } else {
          content.innerHTML = clues.map(c => `<div class="flex items-start gap-1.5"><span class="text-[#7017c9] flex-shrink-0">${icon('crystal', 'w-3.5 h-3.5')}</span>${c}</div>`).join('');
        }
        bubble.classList.remove('hidden');
        const chestImg = document.getElementById('chest-img');
        if (chestImg) chestImg.src = CHEST_OPEN_IMG;
      }).catch(() => {});
    }
    window.closeChestBubble = () => {
      document.getElementById('chest-speech-bubble')?.classList.add('hidden');
      const chestImg = document.getElementById('chest-img');
      if (chestImg) chestImg.src = CHEST_CLOSED_IMG;
    };

    function fireChestConfetti() {
      const canvas = document.getElementById("chest-confetti-canvas");
      if (!canvas) return;
      canvas.classList.remove("hidden");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext("2d");
      const colors = ['#ff2e93', '#7017c9', '#ffd23f', '#3ecbff', '#7ed957', '#ff8a3d'];
      const originX = canvas.width / 2;
      const originY = canvas.height * 0.5;
      const particles = [];
      for (let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 9;
        particles.push({
          x: originX, y: originY,
          size: 5 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 16
        });
      }
      let frame = 0;
      const maxFrames = 130;
      function animate() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.rot += p.vrot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        if (frame < maxFrames) {
          requestAnimationFrame(animate);
        } else {
          canvas.classList.add("hidden");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    window.leaveCockpit = () => {
      if (!confirm("Wirklich zurück zur Lobby? Du verlässt damit das laufende Spiel.")) return;
      window.location.href = "index.html";
    };

    // NAVIGATION: sobald der Host ein Spiel startet, alle Clients dorthin mitnehmen.
    // Kommt die Gruppe aus einem beendeten Spiel zurück (chestPending), öffnet sich
    // einmalig die Truhe mit Konfetti und frischen Hinweisen. Der "schon gesehen"-Status
    // wird serverseitig am eigenen Spielerdatensatz gespeichert (zuverlässiger als der Browser).
    onValue(ref(db, 'gameState'), (snapshot) => {
      const gs = snapshot.val();
      if (gs && gs.status === 'in_game' && gs.activeGame) {
        window.location.href = gs.activeGame;
        return;
      }
      // Host hat "Zurück zur Lobby" gedrückt (oder die Session zurückgesetzt) - alle mitnehmen
      if (gs && gs.status === 'waiting') {
        window.location.href = "index.html";
        return;
      }
      if (gs && gs.chestPending && gs.chestPendingAt && (Date.now() - gs.chestPendingAt < 20000)) {
        get(ref(db, 'players/' + playerId + '/lastSeenChestAt')).then((seenSnap) => {
          if (seenSnap.val() === gs.chestPendingAt) return; // schon gesehen
          update(ref(db, 'players/' + playerId), { lastSeenChestAt: gs.chestPendingAt });
          playChestOpenAnimation();
        });
      }
    });

    // ---- Alberner Lade-Ticker: rotiert unsinnige "Lade..."-Sprüche als Deko ----
    const SILLY_MESSAGES = [
      "Berechne die Wichtigkeit von Ananas auf Pizza...",
      "Suche nach dem Sinn des Lebens... 42 gefunden.",
      "Kalibriere Chaos-Sensoren...",
      "Übersetze Katzenmiauen in Punkte...",
      "Poliere die Kristallkugel...",
      "Zähle unsichtbare Elefanten im Raum...",
      "Bestechung der Würfelgötter läuft...",
      "Sortiere Socken nach Einsamkeitsgrad...",
      "Warnung: zu viel Kaffee im System...",
      "Rechne aus, wie viele Kekse fair wären...",
      "Frage das Universum höflich um Gnade...",
      "Lade absurden Blödsinn nach..."
    ];
    let sillyIndex = 0;
    function cycleSillyLoader() {
      const el = document.getElementById('silly-loader');
      const bar = document.getElementById('silly-loadbar');
      if (!el) return;
      el.style.opacity = 0;
      if (bar) bar.style.width = '4%';
      setTimeout(() => {
        el.innerText = SILLY_MESSAGES[sillyIndex % SILLY_MESSAGES.length];
        sillyIndex++;
        el.style.opacity = 1;
        if (bar) setTimeout(() => { bar.style.width = (30 + Math.random() * 65) + '%'; }, 80);
      }, 250);
    }
    cycleSillyLoader();
    setInterval(cycleSillyLoader, 2800);

    // Avatar-Bild robust laden: bei Fehlern mehrfach erneut versuchen, erst danach auf einen
    // sichtbaren Kreis mit Anfangsbuchstabe zurückfallen (statt das Bild lautlos zu verstecken).
    function bindAvatarFallback(imgEl, name) {
      if (!imgEl) return;
      let attempts = 0;
      imgEl.onerror = function() {
        attempts++;
        const origSrc = imgEl.dataset.origSrc;
        if (attempts <= 4 && origSrc) {
          setTimeout(() => {
            imgEl.src = origSrc + (origSrc.includes('?') ? '&' : '?') + '_r=' + Date.now();
          }, 500 * attempts);
        } else {
          const initial = (name || '?').trim().charAt(0).toUpperCase();
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="#ffd23f"/><text x="50" y="68" font-family="Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="#1a1a2e">${initial}</text></svg>`;
          imgEl.onerror = null;
          imgEl.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }
      };
    }

    // ==== CLAN-TAG-BONUS: Klick auf das Clan-Tag-Abzeichen dreht/schüttelt es und schenkt
    // EINMAL PRO ANMELDUNG (nicht nur pro Seitenaufruf) +40 Punkte. Der Status wird dauerhaft
    // am Spielerdatensatz in Firebase gespeichert. Wird auch in der Admin-Live-Konsole protokolliert.
    const AVATAR_BONUS_POINTS = 40;
    let avatarBonusAnimating = false;

    window.clickAvatarBonus = function() {
      if (avatarBonusAnimating) return;
      avatarBonusAnimating = true;

      const tagEl = document.getElementById("pilot-card-clantag");
      tagEl.classList.remove("avatar-bonus-spin");
      void tagEl.offsetWidth; // Reflow erzwingen, damit die Animation neu startet
      tagEl.classList.add("avatar-bonus-spin");

      setTimeout(() => {
        tagEl.classList.remove("avatar-bonus-spin");
        avatarBonusAnimating = false;

        // Dauerhaft am Spielerdatensatz prüfen - nicht nur eine lokale Variable, die beim
        // Neuladen der Seite zurückgesetzt würde.
        get(ref(db, 'players/' + playerId)).then((snap) => {
          const data = snap.val() || {};
          if (data.avatarBonusClaimed) return; // schon einmal genutzt - Drehen geht trotzdem immer

          // Popup-Anzeige "+40 Punkte"
          const wrap = document.getElementById("avatar-bonus-popup-layer");
          if (wrap) {
            const popup = document.createElement("div");
            popup.className = "avatar-bonus-popup text-[#7ed957] font-jax font-extrabold text-2xl drop-shadow-lg";
            popup.style.textShadow = "2px 2px 0 #1a1a2e, -2px -2px 0 #1a1a2e, 2px -2px 0 #1a1a2e, -2px 2px 0 #1a1a2e";
            popup.innerText = "+" + AVATAR_BONUS_POINTS + " Punkte!";
            wrap.appendChild(popup);
            setTimeout(() => popup.remove(), 1700);
          }

          const newScore = (data.score || 0) + AVATAR_BONUS_POINTS;
          update(ref(db, 'players/' + playerId), { score: newScore, avatarBonusClaimed: true }).then(() => {
            push(ref(db, 'gameLog'), {
              text: '🎡 ' + (data.name || 'Jemand') + ' hat den Clan-Tag geknuddelt: +' + AVATAR_BONUS_POINTS + ' Punkte',
              at: Date.now()
            });
          });
        });
      }, 1750);
    };

    // ==== TRUHEN-KLICKS: jeder Klick lässt die Truhe kräftig vibrieren. Ab dem 10. Klick
    // dreht sie sich einmalig wie der Clan-Tag (links/schütteln/rechts) und schenkt EINMAL
    // PRO ANMELDUNG +50 Punkte. Zählstand und Status werden dauerhaft in Firebase gespeichert.
    const CHEST_CLICK_TARGET = 10;
    const CHEST_BONUS_POINTS = 50;
    let chestClickAnimating = false;

    window.clickChest = function() {
      if (chestClickAnimating) return;
      const chestIcon = document.getElementById("chest-icon");
      if (!chestIcon) return;

      get(ref(db, 'players/' + playerId)).then((snap) => {
        const data = snap.val() || {};
        if (data.chestBonusClaimed) {
          // Bonus schon kassiert - nur noch ein kleines Vibrieren zum Spaß
          chestIcon.classList.remove("chest-vibrate");
          void chestIcon.offsetWidth;
          chestIcon.classList.add("chest-vibrate");
          return;
        }

        const newCount = (data.chestClickCount || 0) + 1;
        update(ref(db, 'players/' + playerId), { chestClickCount: newCount });

        if (newCount < CHEST_CLICK_TARGET) {
          chestIcon.classList.remove("chest-vibrate");
          void chestIcon.offsetWidth;
          chestIcon.classList.add("chest-vibrate");
          return;
        }

        // 10. Klick erreicht: große Dreh-Animation + einmalige Punkte
        chestClickAnimating = true;
        chestIcon.classList.remove("chest-vibrate");
        void chestIcon.offsetWidth;
        chestIcon.classList.add("avatar-bonus-spin");

        setTimeout(() => {
          chestIcon.classList.remove("avatar-bonus-spin");
          chestClickAnimating = false;

          const wrap = document.getElementById("chest-bonus-popup-layer");
          if (wrap) {
            const popup = document.createElement("div");
            popup.className = "avatar-bonus-popup text-[#7ed957] font-jax font-extrabold text-2xl drop-shadow-lg";
            popup.style.textShadow = "2px 2px 0 #1a1a2e, -2px -2px 0 #1a1a2e, 2px -2px 0 #1a1a2e, -2px 2px 0 #1a1a2e";
            popup.innerText = "+" + CHEST_BONUS_POINTS + " Punkte!";
            wrap.appendChild(popup);
            setTimeout(() => popup.remove(), 1700);
          }

          const newScore = (data.score || 0) + CHEST_BONUS_POINTS;
          update(ref(db, 'players/' + playerId), { score: newScore, chestBonusClaimed: true }).then(() => {
            push(ref(db, 'gameLog'), {
              text: '📦 ' + (data.name || 'Jemand') + ' hat die Truhe wachgerüttelt (10x geklickt): +' + CHEST_BONUS_POINTS + ' Punkte',
              at: Date.now()
            });
          });
        }, 1750);
      });
    };

    window.onload = () => {
      get(ref(db, 'players/' + playerId)).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          // Host/Admin gehören ins Admin-Cockpit mit voller Übersicht, nicht ins normale Cockpit
          if (data.name && (data.name.includes("Host") || data.name.includes("Admin"))) {
            window.location.href = "admin-cockpit.html";
            return;
          }
          document.getElementById("cockpit-user-name").innerText = data.name;
          document.getElementById("cockpit-user-id").innerText = "ID: " + playerId.substr(0, 8).toUpperCase();
          document.getElementById("pilot-card-name").innerText = data.name;
          if (data.clanTag) {
            const tagEl = document.getElementById("pilot-card-clantag");
            tagEl.dataset.origSrc = data.clanTag;
            bindAvatarFallback(tagEl, data.name);
            tagEl.src = data.clanTag;
            tagEl.classList.remove("hidden");
          }
        }
      });
    };

    onValue(ref(db, 'players/'), (snapshot) => {
      const players = snapshot.val() || {};
      allPlayersCache = players;

      if (players[playerId]) {
        const isReady = players[playerId].isReady || false;
        const btn = document.getElementById("ready-toggle-btn");
        const statusText = document.getElementById("ready-status-text");

        if (isReady) {
          btn.className = "w-full py-6 bg-[#7ed957] jax-btn text-[#1a1a2e] font-jax font-extrabold text-xl flex items-center justify-center gap-2";
          btn.innerHTML = icon('check', 'w-7 h-7') + "<span>DU BIST BEREIT!</span>";
          statusText.innerText = "Startklar - warte auf die anderen...";
        } else {
          btn.className = "w-full py-6 bg-[#ff2e93] jax-btn text-white font-jax font-extrabold text-xl flex items-center justify-center gap-2 jax-wiggle";
          btn.innerHTML = icon('bell', 'w-7 h-7') + "<span>JETZT BEREIT MELDEN!</span>";
          statusText.innerText = "Noch nicht bereit gemeldet";
        }
      }

      const crewOverview = document.getElementById("cockpit-crew-list");
      crewOverview.innerHTML = "";
      for (let id in players) {
        const p = players[id];
        const initial = (p.name || "?").trim().charAt(0).toUpperCase();
        const div = document.createElement("div");
        div.className = "flex items-center gap-2 bg-[#f4f1ff] p-2 rounded-2xl border-2 border-[#1a1a2e]";
        div.innerHTML = `
          ${p.clanTag
            ? `<img src="${p.clanTag}" class="w-9 h-9 object-contain flex-shrink-0" onerror="this.outerHTML='<div class=&quot;w-9 h-9 rounded-full border-2 border-[#1a1a2e] bg-[#ffd23f] flex items-center justify-center text-[#1a1a2e] font-jax font-extrabold text-sm flex-shrink-0&quot;>${initial}</div>'">`
            : `<div class="w-9 h-9 rounded-full border-2 border-[#1a1a2e] bg-[#ffd23f] flex items-center justify-center text-[#1a1a2e] font-jax font-extrabold text-sm flex-shrink-0">${initial}</div>`
          }
          <span class="text-[#1a1a2e] font-bold text-sm flex-1 truncate">${p.name}</span>
          <span class="jax-chip px-2 py-0.5 text-[10px] font-jax font-bold ${p.isReady ? 'bg-[#7ed957] text-[#1a1a2e]' : 'bg-[#ff2e93] text-white'}">${p.isReady ? 'BEREIT' : 'WARTET'}</span>
        `;
        crewOverview.appendChild(div);
      }
    });


  
    // ==== VERSTECKTES GEHIRN: gibt es in jedem Spiel + im Cockpit einmal zu finden.
    // Jeder Klick lässt es hüpfen + eine kurze Sprechblase mit Klick-Fortschritt zeigen.
    // Je mehr Gehirne man insgesamt schon aktiviert hat, desto öfter muss man das NÄCHSTE
    // anklicken (1. Gehirn = 1 Klick, 2. Gehirn = 2 Klicks, usw.). Bei Aktivierung fliegt es
    // weg. Der Host sieht/bekommt diese Funktion gar nicht erst (spielt nicht um Punkte).
    const BRAIN_POINTS = 20;
    let brainClicksSoFar_cockpit = 0;
    let brainNeededClicks_cockpit = null;

    function showBrainBubble_cockpit(text, isSuccess) {
      const logoEl = document.getElementById("brain-logo");
      if (!logoEl) return;
      const rect = logoEl.getBoundingClientRect();
      const bubble = document.createElement("div");
      bubble.className = "brain-bubble" + (isSuccess ? " brain-bubble-success" : "");
      bubble.style.left = (rect.left + rect.width / 2 - 30) + "px";
      bubble.style.top = (rect.top - 24) + "px";
      bubble.innerText = text;
      document.body.appendChild(bubble);
      setTimeout(() => bubble.remove(), 1400);
    }

    window.clickBrainLogo = function() {
      if (isHost) return; // Host spielt nicht um Punkte - für ihn passiert hier nichts
      const claimedField = "brainFound_cockpit";
      const logoEl = document.getElementById("brain-logo");

      if (logoEl) {
        logoEl.classList.remove("brain-hop");
        void logoEl.offsetWidth;
        logoEl.classList.add("brain-hop");
      }

      function tryActivate() {
        brainClicksSoFar_cockpit++;
        // Bewusst KEINE Sprechblase bei Zwischen-Klicks - erst beim finalen, erfolgreichen Klick
        if (brainClicksSoFar_cockpit < brainNeededClicks_cockpit) return;

        get(ref(db, 'players/' + playerId)).then((snap) => {
          const data = snap.val() || {};
          if (data[claimedField]) return; // inzwischen (z.B. anderes Gerät) schon aktiviert
          const foundCount = data.brainsFoundCount || 0;
          const newScore = (data.score || 0) + BRAIN_POINTS;
          update(ref(db, 'players/' + playerId), {
            score: newScore,
            [claimedField]: true,
            brainsFoundCount: foundCount + 1
          });
          push(ref(db, 'gameLog'), {
            text: '🧠 ' + (data.name || 'Jemand') + ' hat ein Gehirn aktiviert: +' + BRAIN_POINTS + ' Punkte',
            at: Date.now()
          });
          showBrainBubble_cockpit("+" + BRAIN_POINTS + " Punkte", true);
          if (logoEl) logoEl.classList.add("brain-fly-away");
        });
      }

      if (brainNeededClicks_cockpit === null) {
        get(ref(db, 'players/' + playerId)).then((snap) => {
          const data = snap.val() || {};
          if (data["brainFound_cockpit"]) { brainNeededClicks_cockpit = 0; if (logoEl) logoEl.classList.add("hidden"); return; }
          brainNeededClicks_cockpit = (data.brainsFoundCount || 0) + 1;
          tryActivate();
        });
      } else {
        tryActivate();
      }
    };
</script>
</head>
<body class="jax-bg text-white min-h-screen flex flex-col p-4 md:p-6 select-none overflow-hidden relative">
  <div class="blob w-72 h-72 bg-pink-500 -top-20 -left-10"></div>
  <div class="blob w-96 h-96 bg-purple-500 bottom-0 right-0" style="animation-delay:2s;"></div>
  <div class="blob w-56 h-56 bg-orange-400 top-1/3 right-1/4" style="animation-delay:4s;"></div>

  <div class="relative z-10 flex justify-between items-center pb-4">
    <div class="flex items-center space-x-3">
      <button onclick="leaveCockpit()" class="jax-chip bg-white px-3 py-2 flex items-center gap-1.5 text-[#1a1a2e] flex-shrink-0" title="Zurück zur Lobby">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8"/><path d="M14 12h7m0 0l-3-3m3 3l-3 3"/></svg>
        <span class="text-[10px] font-jax font-bold">Lobby</span>
      </button>
      <div class="w-3 h-3 rounded-full bg-[#7ed957] animate-pulse jax-chip"></div>      <div>
        <h1 class="font-jax text-2xl md:text-3xl font-extrabold text-white drop-shadow-[3px_3px_0_rgba(0,0,0,0.5)]">Cockpit</h1>
        <p class="text-xs text-white/70 font-semibold">Bereit machen für die nächste Runde!</p>
      </div>
    </div>
    <div class="jax-card px-4 py-2 flex items-center space-x-3">
      <div>
        <div id="cockpit-user-name" class="text-sm font-jax font-bold text-[#1a1a2e]">PILOT</div>
        <div id="cockpit-user-id" class="text-[10px] text-[#1a1a2e]/50">ID: ---</div>
      </div>
    </div>
  </div>

  <div class="relative z-10 flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 my-6">
    <div class="jax-card p-4 flex flex-col text-[#1a1a2e]">
      <div class="jax-chip bg-[#ffd23f] p-2.5 flex-shrink-0 flex items-center gap-2.5">
        <img src="https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/renewable-energy.png" alt="" class="w-11 h-11 flex-shrink-0 spin-on-hover" onerror="this.style.display='none'">
        <div class="flex-1 min-w-0">
          <div id="silly-loader" class="text-[10px] text-[#1a1a2e] font-jax font-bold italic text-center min-h-[1.4rem] transition-opacity duration-300"></div>
          <div class="w-full h-2 bg-[#1a1a2e]/15 rounded-full overflow-hidden mt-1.5">
            <div id="silly-loadbar" class="h-full bg-[#7017c9] rounded-full" style="width: 10%; transition: width 1.1s cubic-bezier(.4,0,.2,1);"></div>
          </div>
        </div>
      </div>

      <div class="flex-1"></div>

      <div class="relative flex flex-col items-center justify-center flex-shrink-0">
        <div id="chest-speech-bubble" class="hidden absolute left-1/2 z-20 w-64 max-w-[80vw]" style="bottom: 100%; transform: translateX(-50%); margin-bottom: 10px;">
          <div class="bg-white border-[3px] border-[#1a1a2e] rounded-2xl p-3 pr-7 shadow-lg relative">
            <button onclick="closeChestBubble()" class="absolute top-1.5 right-2 text-[#1a1a2e]/40 hover:text-[#1a1a2e] font-black text-sm leading-none">✕</button>
            <div id="chest-speech-content" class="text-xs text-[#1a1a2e] space-y-1 text-left"></div>
          </div>
          <div class="w-4 h-4 bg-white border-r-[3px] border-b-[3px] border-[#1a1a2e] rotate-45 mx-auto -mt-2"></div>
        </div>
        <div id="chest-bonus-popup-layer" class="absolute inset-x-0 top-0 flex justify-center pointer-events-none" style="z-index:5;"></div>
        <div id="chest-fly-layer" class="absolute inset-x-0 bottom-0 h-16 pointer-events-none"></div>
        <div id="chest-icon" onclick="clickChest()" class="chest-clickable drop-shadow-[0_6px_10px_rgba(112,23,201,0.35)]" title="Klick mich!">
          <img id="chest-img" src="https://github.com/thundermon89-glitch/Quiznight/raw/main/Kistegeschlosssencockpit.jpg" alt="Truhe" class="w-28 h-28 md:w-36 md:h-36 object-contain">
        </div>
      </div>
      <div class="text-center text-sm mt-2 flex-shrink-0 text-[#1a1a2e]/60 italic">Spiel eine Runde - die Truhe redet mit dir! 🔮</div>
    </div>

    <div class="jax-card-dark p-6 flex flex-col items-center justify-between text-center space-y-4">
      <div class="space-y-2">
        <h2 class="font-jax text-2xl font-extrabold text-white">Bereitschaft</h2>
        <p class="text-xs text-white/60">Erst wenn alle bereit sind, kann's losgehen!</p>
      </div>

      <div class="w-full my-auto space-y-3">
        <img src="https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/cpu.png" alt="" class="w-14 h-14 mx-auto" onerror="this.style.display='none'">
        <button id="ready-toggle-btn" onclick="toggleReadyStatus()" class="w-full py-6 bg-[#ff2e93] jax-btn text-white font-jax font-extrabold text-xl flex items-center justify-center gap-2 jax-wiggle">
          <span><svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .8-.3 1.6-.9 2.2L4 16h16l-2.1-2.3a3 3 0 0 1-.9-2.2V8a5 5 0 0 0-5-5z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg></span> <span>JETZT BEREIT MELDEN!</span>
        </button>
        <div id="ready-status-text" class="text-xs font-bold text-white/70">Noch nicht bereit gemeldet</div>
      </div>
    </div>

    <div class="jax-card p-4 flex flex-col text-[#1a1a2e]">
      <div class="text-xs font-jax font-bold uppercase tracking-wide border-b-2 border-[#1a1a2e]/10 pb-2">Crew Status</div>
      <div class="flex items-center justify-center my-3 flex-shrink-0">
        <div class="relative flex-shrink-0">
          <div id="avatar-bonus-popup-layer" class="absolute inset-x-0 top-0 flex justify-center pointer-events-none" style="z-index:5;"></div>
          <img id="pilot-card-clantag" src="" onclick="clickAvatarBonus()" class="avatar-clickable w-36 h-36 object-contain hidden" title="Klick mich!">
        </div>
      </div>
      <div id="pilot-card-name" class="hidden"></div>
      <div id="pilot-card-id" class="hidden"></div>
      <div class="flex-1 min-h-[4px]"></div>
      <div id="cockpit-crew-list" class="text-xs space-y-1.5 overflow-y-auto flex-shrink-0" style="max-height: 220px;"></div>
    </div>
  </div>

  <!-- RAD DES WAHNSINNS MODAL -->
  <div id="chaos-card-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="jax-card jax-pop p-8 w-full max-w-sm text-center space-y-3 text-[#1a1a2e]">
      <div class="font-jax text-lg font-extrabold text-[#7017c9] flex items-center justify-center gap-2">
        <span><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7.8 3"/></svg></span> Rad des Wahnsinns
      </div>
      <div class="text-[10px] text-[#1a1a2e]/50 -mt-1">Kleine Dinge geschehen...</div>
      <div id="chaos-roll-intro" class="text-sm font-semibold min-h-[2.5rem] flex items-center justify-center"></div>
      <div id="chaos-wheel-container" class="py-2"></div>
      <div id="chaos-card-result" class="hidden"></div>
      <div id="chaos-modal-continue" class="hidden"></div>
    </div>
  </div>

  <canvas id="chest-confetti-canvas" class="hidden fixed inset-0 z-[70] pointer-events-none"></canvas>

  <!-- VERSCHLAFEN-STRAFE POPUP -->
  <div id="late-penalty-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="jax-card jax-pop p-8 max-w-sm text-center space-y-4 text-[#1a1a2e]">
      <div class="text-[#ff2e93] flex justify-center"><svg class="w-14 h-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .8-.3 1.6-.9 2.2L4 16h16l-2.1-2.3a3 3 0 0 1-.9-2.2V8a5 5 0 0 0-5-5z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg></div>
      <div id="late-penalty-text" class="font-jax font-bold text-lg leading-relaxed"></div>
      <button onclick="closeLatePenaltyModal()" class="w-full py-3 jax-btn bg-[#ffd23f] text-[#1a1a2e] font-jax font-bold text-sm">Verstanden</button>
    </div>
  </div>


  <img id="brain-logo" src="https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/9455-removebg-preview.png"
    onclick="clickBrainLogo()" class="hidden fixed bottom-2 left-2 h-8 md:h-10 w-auto z-30 cursor-pointer transition-transform hover:scale-110"
    onerror="this.style.display='none'" alt="">
</body>
</html>
