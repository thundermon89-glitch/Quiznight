<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirnschmalz-Arena - Siegerehrung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-jax { font-family: 'Baloo 2', sans-serif; }

    .night-sky {
      background: radial-gradient(ellipse at top, #1a0d3d 0%, #0a0518 55%, #030209 100%);
    }
    .jax-card {
      background: #ffffff;
      border: 4px solid #1a1a2e;
      border-radius: 22px;
      box-shadow: 7px 7px 0 rgba(0,0,0,0.85);
    }
    .jax-btn {
      font-family: 'Baloo 2', sans-serif;
      border: 3px solid #1a1a2e;
      border-radius: 18px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.85);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .jax-btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(0,0,0,0.85); }
    .jax-btn:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.85); }

    .podium-step {
      background: linear-gradient(180deg, #2b2050 0%, #1a1238 100%);
      border: 3px solid #ffd23f;
      border-top: 5px solid #ffd23f;
      border-radius: 14px 14px 0 0;
      opacity: 0;
      transform: translateY(60px) scale(0.85);
      transition: opacity 0.7s cubic-bezier(.34,1.56,.64,1), transform 0.7s cubic-bezier(.34,1.56,.64,1);
    }
    .podium-step.revealed { opacity: 1; transform: translateY(0) scale(1); }
    .podium-rank1 { border-color: #ffd23f; box-shadow: 0 0 40px rgba(255,210,63,0.5); }
    .podium-rank2 { border-color: #cbd5e1; }
    .podium-rank3 { border-color: #d97742; }

    .podium-photo-frame {
      width: 100px; height: 120px;
      display: flex; align-items: flex-end; justify-content: center;
      overflow: visible;
      margin: 0 auto -32px auto;
      position: relative; z-index: 5;
    }
    .podium-photo-frame img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .podium-photo-frame.empty {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid #4a3f6b;
      background: #0a0518;
      opacity: 0.5;
      align-items: center;
    }

    /* Rakete fliegt jetzt über eine feste Vollbild-Ebene mit echten Bildschirm-Koordinaten
       (JS-gesteuert), nicht mehr über eine lokale CSS-Keyframe-Animation. */
    .rocket-wrap-abs {
      position: fixed;
      left: 0; top: 0;
      width: 100px; height: 130px;
      transform-origin: 50% 73%;
      pointer-events: none;
      z-index: 60;
      opacity: 0;
    }
    .rocket-photo-window {
      position: absolute; left: 34px; top: 24px; width: 32px; height: 32px;
      border-radius: 50%; overflow: hidden; background: #0a0518;
    }
    .rocket-photo-window img { width: 100%; height: 100%; object-fit: cover; }

    @keyframes rocketFlameFlicker {
      0%,100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.35) scaleX(0.82); }
    }
    .rocket-flame { animation: rocketFlameFlicker 0.13s ease-in-out infinite; transform-origin: 50% 0%; }

    @keyframes smokePuff {
      0% { transform: translate(0,0) scale(0.6); opacity: 0.55; }
      100% { transform: translate(var(--sx,0), 24px) scale(1.5); opacity: 0; }
    }
    .smoke-puff { animation: smokePuff 0.55s ease-out infinite; }

    @keyframes photoSettle {
      0% { opacity: 0; transform: scale(0.5); }
      60% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }
    .photo-settle { animation: photoSettle 0.3s ease-out; }

    @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2.5s ease-in-out infinite; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece { position: absolute; top: -20px; animation: confettiFall linear forwards; }

    @keyframes fireworkBurst {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
    }
    .firework-particle {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      animation: fireworkBurst 1.1s ease-out forwards;
    }

    @keyframes titlePop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .title-pop { animation: titlePop 0.8s cubic-bezier(.34,1.56,.64,1); }

    @keyframes nameReveal {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .name-reveal { animation: nameReveal 0.5s ease-out forwards; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://play-ground-82b46-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let playerId = localStorage.getItem("quiz_player_id");
    let isHost = false;

    // ================= PODEST-BILDER PRO PLATZ =================
    // Trag hier später deine eigenen Bilder ein (z.B. lustige Fotos), Schlüssel = Platzierung
    // (1 = Erster Platz usw.). Bleibt ein Platz leer, wird automatisch eine Pokal-Grafik gezeigt.
    const PODIUM_IMAGES = {
      // 1: "https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/dein-bild-platz1.png",
      // 2: "https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/dein-bild-platz2.png",
      // 3: "https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/dein-bild-platz3.png",
    };

    const TROPHY_SVG = '<svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z"/><path d="M5 5H3v2a4 4 0 0 0 4 4M19 5h2v2a4 4 0 0 1-4 4"/><path d="M12 12v4"/><path d="M8 20h8"/><path d="M9 20v-2h6v2"/></svg>';

    // ================= STERNENHIMMEL =================
    function renderStars() {
      const layer = document.getElementById("stars-layer");
      let html = "";
      for (let i = 0; i < 60; i++) {
        const size = 1 + Math.random() * 2;
        html += `<div class="star" style="left:${Math.random()*100}%; top:${Math.random()*70}%; width:${size}px; height:${size}px; animation-delay:${Math.random()*2.5}s;"></div>`;
      }
      layer.innerHTML = html;
    }

    // ================= KONFETTI & FEUERWERK =================
    const CONFETTI_COLORS = ['#ff2e93', '#7017c9', '#ffd23f', '#3ecbff', '#7ed957', '#ff8a3d'];
    function burstConfetti(count) {
      const layer = document.getElementById("confetti-layer");
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        const size = 6 + Math.random() * 6;
        el.className = "confetti-piece";
        el.style.left = Math.random() * 100 + "%";
        el.style.width = size + "px";
        el.style.height = size * 0.6 + "px";
        el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.animationDuration = (2 + Math.random() * 2) + "s";
        el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        layer.appendChild(el);
        setTimeout(() => el.remove(), 4200);
      }
    }

    function burstFirework(cx, cy) {
      const layer = document.getElementById("firework-layer");
      const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      for (let i = 0; i < 26; i++) {
        const angle = (Math.PI * 2 * i) / 26;
        const dist = 70 + Math.random() * 60;
        const el = document.createElement("div");
        el.className = "firework-particle";
        el.style.left = cx + "px";
        el.style.top = cy + "px";
        el.style.background = color;
        el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        layer.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }
    }

    function fireworksShow(rounds) {
      let i = 0;
      const interval = setInterval(() => {
        burstFirework(
          window.innerWidth * (0.2 + Math.random() * 0.6),
          window.innerHeight * (0.15 + Math.random() * 0.35)
        );
        i++;
        if (i >= rounds) clearInterval(interval);
      }, 350);
    }

    // ================= ERFOLGE AUS DEM PROTOKOLL ERMITTELN =================
    function computeAchievements(players, logEntries) {
      const perGamePoints = {}; // playerId -> { spielN: summe }
      const easterEggCount = {}; // playerId -> Anzahl
      const nameToId = {};
      Object.keys(players).forEach(id => { nameToId[players[id].name] = id; });

      logEntries.forEach(entry => {
        const text = entry.text || "";

        const gainMatch = text.match(/^📈 (.+?): \+(\d+) Punkte in Spiel (\d+)/);
        if (gainMatch) {
          const id = nameToId[gainMatch[1]];
          if (id) {
            perGamePoints[id] = perGamePoints[id] || {};
            const g = gainMatch[3];
            perGamePoints[id][g] = (perGamePoints[id][g] || 0) + parseInt(gainMatch[2], 10);
          }
        }

        if (text.includes("hat den Lemming gefangen") || text.includes("hat die Truhe wachgerüttelt") || text.includes("hat den Clan-Tag geknuddelt")) {
          const nameMatch = text.match(/^[^\s]+ (.+?) hat/);
          if (nameMatch) {
            const id = nameToId[nameMatch[1]];
            if (id) easterEggCount[id] = (easterEggCount[id] || 0) + 1;
          }
        }
      });

      // Pro Spiel den Bestpunktesammler ermitteln
      const topPerGame = {}; // spielN -> { id, points }
      Object.keys(perGamePoints).forEach(id => {
        Object.keys(perGamePoints[id]).forEach(g => {
          const pts = perGamePoints[id][g];
          if (!topPerGame[g] || pts > topPerGame[g].points) {
            topPerGame[g] = { id, points: pts };
          }
        });
      });

      // Meiste Easter Eggs insgesamt
      let topEggId = null, topEggCount = 0;
      Object.keys(easterEggCount).forEach(id => {
        if (easterEggCount[id] > topEggCount) { topEggCount = easterEggCount[id]; topEggId = id; }
      });

      return { topPerGame, easterEggCount, topEggId, topEggCount };
    }

    function achievementSentencesFor(playerId, rank, achievements, n, score) {
      const sentences = [];

      if (rank === 1) {
        sentences.push("🏆 Sieger der <img src=\"https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/9486-removebg-preview.png\" class=\"inline-block h-4 w-4 align-middle -mt-0.5\" onerror=\"this.style.display='none'\"> Hirnschmalz-Arena mit " + score + " Punkten!");
      } else if (rank === n) {
        sentences.push("Landet mit " + score + " Punkten auf dem letzten Platz.");
      } else {
        sentences.push("Belegt mit " + score + " Punkten Platz " + rank + ".");
      }

      for (const g in achievements.topPerGame) {
        if (achievements.topPerGame[g].id === playerId) {
          sentences.push("War in Spiel " + g + " nicht zu stoppen und sammelte dort die meisten Punkte!");
          break;
        }
      }

      if (achievements.topEggId === playerId && achievements.topEggCount > 0) {
        sentences.push("Hat außerdem die meisten Easter Eggs der Nacht gefunden (" + achievements.topEggCount + "x)!");
      }

      const fillers = rank === 1
        ? ["Ein verdienter Sieg nach einer langen Nacht voller Fragen!", "Respekt für diese Leistung."]
        : rank === n
          ? ["Aber Dabeisein ist bekanntlich alles!", "Nächstes Mal wird's besser."]
          : ["War die ganze Nacht über mit vollem Einsatz dabei.", "Hat sich wacker geschlagen."];

      let fillerIdx = 0;
      while (sentences.length < 2 && fillerIdx < fillers.length) {
        sentences.push(fillers[fillerIdx]);
        fillerIdx++;
      }
      if (sentences.length > 4) sentences.length = 4;
      return sentences;
    }

    // ================= REIHENFOLGE-BERECHNUNG =================
    // Physische Anordnung: Platz 1 in der Mitte, die anderen wechselseitig nach rechts/links
    function computeLayoutOrder(n) {
      const center = Math.floor((n - 1) / 2);
      const offsets = [0];
      let o = 1;
      while (offsets.length < n) {
        offsets.push(o);
        if (offsets.length < n) offsets.push(-o);
        o++;
      }
      const rankAtOffset = {};
      offsets.forEach((off, idx) => { rankAtOffset[off] = idx + 1; });
      const slots = [];
      for (let i = 0; i < n; i++) slots.push(rankAtOffset[i - center]);
      return slots;
    }

    // Enthüllungs-Reihenfolge: Mitte -> Letzter Platz -> reih um -> zum Schluss Platz 1
    // Enthüllungs-Reihenfolge: LETZTER PLATZ zuerst -> Mitte -> reih um -> zum Schluss Platz 1
    function computeRevealOrder(n) {
      if (n === 1) return [1];
      const order = [n];
      const used = new Set([n]);
      const middle = Math.max(1, Math.ceil(n / 2));
      if (!used.has(middle)) { order.push(middle); used.add(middle); }
      const remaining = [];
      for (let r = 2; r <= n - 1; r++) { if (!used.has(r)) remaining.push(r); }
      let front = 0, back = remaining.length - 1;
      let takeBack = true;
      while (front <= back) {
        if (takeBack) { order.push(remaining[back]); back--; }
        else { order.push(remaining[front]); front++; }
        takeBack = !takeBack;
      }
      if (!used.has(1)) order.push(1);
      return order;
    }

    // ================= AUFBAU =================
    let rankedPlayers = []; // [{id, name, score, avatar, clanTag}], Index 0 = Platz 1
    let achievements = null;

    // Fragezeichen-Silhouette für noch nicht enthüllte Plätze
    const MYSTERY_SVG = '<svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#6b5f99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 4"/><circle cx="12" cy="17" r="0.6" fill="#6b5f99"/></svg>';

    // Bewusst schief/krakelig gezeichnete "Kinderzeichnung"-Rakete, die das Spielerfoto im
    // Bullauge hereinträgt - inkl. Flossen, Flamme und Rauchwölkchen am Heck.
    const ROCKET_FLIGHT_MS = 4200; // deutlich länger als vorher

    // Kurzer Motor-Aussetzer: Flamme flackert kurz weg, dabei spuckt der Motor ein paar
    // schwarze Rußwolken aus - wird per JS zu festen Zeitpunkten während des Flugs ausgelöst.
    function triggerEngineSputter(rocket) {
      const flame = rocket.querySelector('.rocket-flame');
      if (flame) {
        flame.style.transition = 'opacity 0.12s ease-out';
        flame.style.opacity = '0.1';
        setTimeout(() => { if (flame) flame.style.opacity = '1'; }, 220);
      }
      const svg = rocket.querySelector('svg');
      if (!svg) return;
      for (let i = 0; i < 4; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', 44 + Math.random() * 12);
        c.setAttribute('cy', 100 + Math.random() * 10);
        c.setAttribute('r', 4 + Math.random() * 3.5);
        c.setAttribute('fill', '#151515');
        c.style.opacity = '0.85';
        c.style.setProperty('--sx', (Math.random() * 26 - 13) + 'px');
        c.style.animation = 'smokePuff ' + (0.5 + Math.random() * 0.3) + 's ease-out forwards';
        svg.appendChild(c);
        setTimeout(() => c.remove(), 950);
      }
    }

    // Fliegt die Rakete quer über den GANZEN Bildschirm (echte Viewport-Koordinaten, nicht mehr
    // nur lokal um den Zielrahmen herum) - startet weit außerhalb in einer zufälligen Ecke,
    // macht einen großen Bogen samt Schleife und landet am Ende exakt im Zielrahmen.
    function flyRocketAcrossScreen(photoUrl, targetEl, onArrive) {
      const layer = document.getElementById("rocket-fly-layer");
      const rocket = document.createElement("div");
      rocket.className = "rocket-wrap-abs";
      rocket.innerHTML = rocketMarkup(photoUrl);
      layer.appendChild(rocket);

      const vw = window.innerWidth, vh = window.innerHeight;
      const rect = targetEl.getBoundingClientRect();
      const targetX = rect.left + rect.width / 2;
      const targetY = rect.top + rect.height / 2;
      const HALF_W = 50, HALF_H = 65;

      const corners = [
        { x: -90, y: vh + 90 },
        { x: vw + 90, y: vh + 90 },
        { x: -90, y: -90 },
        { x: vw + 90, y: -90 }
      ];
      const start = corners[Math.floor(Math.random() * corners.length)];

      const waypoints = [
        { x: start.x, y: start.y, rot: 25, scale: 0.75, dur: 0 },
        { x: vw * (0.12 + Math.random() * 0.1), y: vh * (0.7 + Math.random() * 0.15), rot: -15, scale: 0.92, dur: 700 },
        { x: vw * (0.4 + Math.random() * 0.1), y: vh * (0.08 + Math.random() * 0.08), rot: -85, scale: 1.0, dur: 650 },
        { x: vw * (0.82 + Math.random() * 0.08), y: vh * (0.45 + Math.random() * 0.15), rot: -190, scale: 1.05, dur: 650 },
        { x: vw * 0.62, y: vh * 0.28, rot: -300, scale: 1.0, dur: 550 },
        { x: vw * 0.46, y: vh * 0.46, rot: -420, scale: 1.05, dur: 500 },
        { x: vw * 0.56, y: vh * 0.36, rot: -540, scale: 1.0, dur: 450 },
        { x: targetX, y: targetY, rot: -565, scale: 0.32, dur: 700 }
      ];

      function place(i) {
        const w = waypoints[i];
        rocket.style.transform = `translate(${w.x - HALF_W}px, ${w.y - HALF_H}px) rotate(${w.rot}deg) scale(${w.scale})`;
      }
      place(0);
      rocket.style.opacity = '1';

      let i = 1;
      function step() {
        if (i >= waypoints.length) {
          setTimeout(() => { rocket.remove(); onArrive(); }, 150);
          return;
        }
        const w = waypoints[i];
        rocket.style.transition = `transform ${w.dur}ms cubic-bezier(.42,.05,.32,1)`;
        place(i);
        if (i === 2 || i === 5) triggerEngineSputter(rocket);
        i++;
        setTimeout(step, w.dur);
      }
      requestAnimationFrame(() => setTimeout(step, 30));
    }

    function rocketMarkup(photoUrl) {
      return `
        <svg viewBox="0 0 100 130" style="width:100%; height:100%; overflow:visible;">
          <g>
            <circle class="smoke-puff" style="--sx:-7px; animation-delay:0s;" cx="36" cy="116" r="7" fill="#999" opacity="0.5"/>
            <circle class="smoke-puff" style="--sx:8px; animation-delay:0.15s;" cx="60" cy="121" r="5.5" fill="#bbb" opacity="0.4"/>
            <circle class="smoke-puff" style="--sx:1px; animation-delay:0.3s;" cx="48" cy="125" r="4.5" fill="#888" opacity="0.35"/>
          </g>
          <g class="rocket-flame">
            <path d="M38,98 Q29,113 42,119 Q46,108 50,119 Q63,114 56,98 Q50,105 46,98 Q44,105 38,98 Z" fill="#ff8a3d" stroke="#1a1006" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M42,101 Q39,109 45,112 Q47,105 49,112 Q54,110 51,101 Z" fill="#ffd23f"/>
          </g>
          <path d="M32,78 L9,103 L34,90 Z" fill="#ff2e93" stroke="#1a1a2e" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M69,75 L93,99 L66,87 Z" fill="#3ecbff" stroke="#1a1a2e" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M50,6 C32,15 27,50 32,86 C33,96 68,95 70,84 C73,47 68,13 50,6 Z" fill="#f4f1ff" stroke="#1a1a2e" stroke-width="3.4" stroke-linejoin="round"/>
          <circle cx="50" cy="42" r="18" fill="#0a0518" stroke="#1a1a2e" stroke-width="3.4"/>
          <circle cx="50" cy="8" r="4.5" fill="#ffd23f" stroke="#1a1a2e" stroke-width="2.2"/>
        </svg>
        <div class="rocket-photo-window">${photoUrl ? `<img src="${photoUrl}">` : ''}</div>
      `;
    }

    function buildPodium() {
      const n = rankedPlayers.length;
      const layoutOrder = computeLayoutOrder(n); // Position i (links->rechts) -> Rang
      const wrap = document.getElementById("podium-wrap");
      wrap.innerHTML = "";

      layoutOrder.forEach((rank) => {
        const p = rankedPlayers[rank - 1];
        if (!p) return;
        const heightPx = n > 1 ? Math.round(70 + ((n - rank) / (n - 1)) * 170) : 180;
        const rankClass = rank === 1 ? 'podium-rank1' : rank === 2 ? 'podium-rank2' : rank === 3 ? 'podium-rank3' : '';

        const col = document.createElement("div");
        col.className = "flex flex-col items-center justify-end flex-shrink-0";
        col.style.width = (n <= 6 ? 118 : 92) + "px";
        col.innerHTML = `
          <div id="podium-photo-${rank}" class="podium-photo-frame empty">
            ${MYSTERY_SVG}
          </div>
          <div id="podium-label-${rank}" class="podium-label w-full flex flex-col items-center justify-end text-center px-1 pb-2" style="min-height: 78px;">
            <div id="podium-name-${rank}" class="text-white/90 text-[11px] font-bold w-full leading-tight break-words"></div>
            <div id="podium-score-${rank}" class="text-[#ffd23f] font-jax font-extrabold text-sm mt-0.5"></div>
          </div>
          <div id="podium-step-${rank}" class="podium-step ${rankClass} w-full flex items-start justify-center pt-3" style="height:${heightPx}px;">
            <div class="font-jax text-white font-extrabold text-2xl">${rank}.</div>
          </div>
        `;
        wrap.appendChild(col);
      });
    }

    function revealRank(rank, animate) {
      const p = rankedPlayers[rank - 1];
      if (!p) return;
      const step = document.getElementById("podium-step-" + rank);
      const nameEl = document.getElementById("podium-name-" + rank);
      const scoreEl = document.getElementById("podium-score-" + rank);
      const photoEl = document.getElementById("podium-photo-" + rank);
      if (!step) return;

      step.classList.add("revealed");
      nameEl.innerText = p.name;
      nameEl.classList.add("name-reveal");
      scoreEl.innerText = p.score + " Pkt.";
      scoreEl.classList.add("name-reveal");

      // Bild fliegt JETZT erst mit der Rakete rein - vorher war nur ein Fragezeichen zu sehen,
      // damit niemand die Platzierung an den Bildern vorab erraten konnte. Kommt jemand erst
      // mitten in der Zeremonie dazu, werden bereits enthüllte Plätze ohne Raketen-Show
      // sofort korrekt angezeigt (kein Nachfeuerwerk-Spam beim Aufholen).
      if (photoEl) {
        const img = PODIUM_IMAGES[rank] || p.head || p.clanTag || p.avatar;

        if (!animate) {
          photoEl.classList.remove("empty");
          photoEl.classList.add("settled");
          photoEl.innerHTML = img ? `<img src="${img}" class="object-contain" onerror="this.style.display='none'">` : TROPHY_SVG;
        } else {
          flyRocketAcrossScreen(img, photoEl, () => {
            photoEl.classList.remove("empty");
            photoEl.classList.add("settled");
            photoEl.innerHTML = img ? `<img src="${img}" class="object-contain" onerror="this.style.display='none'">` : TROPHY_SVG;
            photoEl.classList.add("photo-settle");
          });
        }
      }

      const captionWrap = document.getElementById("achievement-banner");
      const sentences = achievementSentencesFor(p.id, rank, achievements, rankedPlayers.length, p.score);
      captionWrap.innerHTML = `
        <div class="jax-card px-6 py-5 text-center title-pop max-w-md">
          <div class="font-jax text-xl font-extrabold text-[#1a1a2e] mb-2">${p.name}</div>
          ${sentences.map(s => `<div class="text-[#7017c9] font-semibold text-sm leading-snug">${s}</div>`).join('')}
        </div>
      `;

      const rect = step.getBoundingClientRect();
      burstConfetti(rank === 1 ? 90 : 40);
      if (rank === 1) {
        fireworksShow(9);
      } else {
        burstFirework(rect.left + rect.width / 2, rect.top);
      }
    }

    // ================= GEMEINSAMER ZUSTAND: der Host bestimmt das Tempo, alle sehen dasselbe =================
    let lastRenderedRevealIndex = 0;

    // NAVIGATION: sobald der Host "Zurück zur Lobby" klickt, nimmt das ALLE Spieler mit
    onValue(ref(db, 'gameState'), (snapshot) => {
      const gs = snapshot.val();
      if (gs && gs.status === 'waiting') {
        window.location.href = "index.html";
      }
    });

    window.hostRevealNext = function() {
      get(ref(db, 'ceremonyState/revealIndex')).then((snap) => {
        const cur = snap.val() || 0;
        if (cur >= rankedPlayers.length) return;
        update(ref(db, 'ceremonyState'), { revealIndex: cur + 1 });
      });
    };

    let revealOrder = [];

    async function startCeremony() {
      renderStars();

      // Nur der Host baut den Zustand neu auf (falls er noch nicht existiert) - alle
      // anderen (und der Host selbst) lesen anschließend aus 'ceremonyState'.
      if (isHost) {
        const existing = await get(ref(db, 'ceremonyState'));
        if (!existing.exists()) {
          const [playersSnap, logSnap] = await Promise.all([
            get(ref(db, 'players/')),
            get(ref(db, 'gameLog/'))
          ]);
          const players = playersSnap.val() || {};
          const logObj = logSnap.val() || {};
          const logEntries = Object.values(logObj).sort((a, b) => (a.at || 0) - (b.at || 0));

          const activeIds = Object.keys(players).filter(id => players[id].name && !players[id].name.includes("Host") && !players[id].name.includes("Admin"));
          const ranked = activeIds
            .map(id => ({ id, name: players[id].name, score: players[id].score || 0, avatar: players[id].avatar || null, clanTag: players[id].clanTag || null, head: players[id].head || null }))
            .sort((a, b) => b.score - a.score);

          const ach = computeAchievements(players, logEntries);
          const order = computeRevealOrder(ranked.length);

          await set(ref(db, 'ceremonyState'), {
            rankedPlayers: ranked,
            achievements: ach,
            revealOrder: order,
            revealIndex: 0,
            createdAt: Date.now()
          });
        }
      }
    }

    window.onload = () => {
      if (!playerId) { window.location.href = "index.html"; return; }
      get(ref(db, 'players/' + playerId)).then((snap) => {
        const data = snap.val();
        if (data && data.name && (data.name.includes("Host") || data.name.includes("Admin"))) {
          isHost = true;
        }
        // Der Zeremonie-Zustand wird ERST JETZT beobachtet - also garantiert NACHDEM isHost
        // feststeht. Sonst könnte der Host-Button fälschlich für immer versteckt bleiben,
        // falls die Zeremonie-Daten schneller ankommen als dieser Check hier fertig ist.
        watchCeremonyState();
        startCeremony();
      });
    };

    function watchCeremonyState() {
      onValue(ref(db, 'ceremonyState'), (snapshot) => {
        const cs = snapshot.val();
        if (!cs || !cs.rankedPlayers) return;

        if (rankedPlayers.length === 0) {
          // Erster Aufbau (auf diesem Gerät) - Podest einmalig erzeugen
          rankedPlayers = cs.rankedPlayers;
          achievements = cs.achievements;
          revealOrder = cs.revealOrder;
          buildPodium();
          document.getElementById("host-next-btn")?.classList.toggle("hidden", !isHost);
        }

        const revealIndex = cs.revealIndex || 0;
        const catchUpCount = revealIndex - lastRenderedRevealIndex;
        const animate = catchUpCount === 1; // nur bei einem EINZELNEN neuen Schritt die Rakete zeigen
        while (lastRenderedRevealIndex < revealIndex) {
          revealRank(revealOrder[lastRenderedRevealIndex], animate);
          lastRenderedRevealIndex++;
        }

        if (revealIndex >= rankedPlayers.length && rankedPlayers.length > 0) {
          document.getElementById("ceremony-status").innerHTML = "🎉 Das war die <img src=\"https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/9486-removebg-preview.png\" class=\"inline-block h-5 w-5 align-middle -mt-1\" onerror=\"this.style.display='none'\"> Hirnschmalz-Arena! 🎉";
          document.getElementById("host-next-btn")?.classList.add("hidden");
          if (isHost) document.getElementById("host-end-btn").classList.remove("hidden");
        }
      });
    }

    window.hostEndCeremony = function() {
      if (!confirm("Die Partie wirklich beenden? Alle Spiele werden zurückgesetzt, die Lobby wird komplett geleert (alle Spieler werden abgemeldet) und alle Spielerdaten (Punkte usw.) werden gelöscht - für eine wirklich neue Sitzung.")) return;

      // Jedes Mini-Spiel komplett zurücksetzen, damit die nächste Partie ganz von vorne
      // beginnt (kein Steckenbleiben in altem Zustand der letzten Runde).
      const gameStateResets = {};
      for (let i = 1; i <= 9; i++) gameStateResets['game' + i + 'State'] = null;
      update(ref(db), gameStateResets);

      // Zeremonie-Zustand löschen, damit sie beim nächsten Mal wieder frisch ausgezählt wird
      set(ref(db, 'ceremonyState'), null);

      // Lobby wirklich komplett leeren: alle Spielerdaten (Punkte, Bereitschaft, gefundene
      // Gehirne usw.) werden gelöscht, nicht nur "auf null" gesetzt - für eine echte neue
      // Sitzung müssen sich alle neu anmelden.
      remove(ref(db, 'players/'));

      // Alle Spieler zurück zur Lobby holen (eigenes Gerät wird durch denselben Zustand
      // ebenfalls mitgenommen, siehe Listener oben)
      set(ref(db, 'gameState'), { status: 'waiting' });
    };
  </script>
</head>
<body class="night-sky text-white min-h-screen flex flex-col items-center justify-between p-4 md:p-8 overflow-hidden relative select-none">

  <div id="stars-layer" class="fixed inset-0 pointer-events-none z-0"></div>
  <div id="confetti-layer" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>
  <div id="firework-layer" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>
  <div id="rocket-fly-layer" class="fixed inset-0 pointer-events-none z-[60] overflow-visible"></div>

  <header class="relative z-10 text-center pt-4">    <h1 class="font-jax text-3xl md:text-5xl font-extrabold text-[#ffd23f] title-pop" style="text-shadow: 3px 3px 0 #1a1006, -3px -3px 0 #1a1006, 3px -3px 0 #1a1006, -3px 3px 0 #1a1006;">
      🏆 SIEGEREHRUNG 🏆
    </h1>
    <div id="ceremony-status" class="text-white/60 text-sm mt-2">Der Moderator enthüllt gleich die Platzierungen...</div>
  </header>

  <div id="achievement-banner" class="relative z-10 my-4 min-h-[100px] flex items-center justify-center w-full max-w-md"></div>

  <div id="podium-wrap" class="relative z-10 flex items-end justify-center gap-2 md:gap-3 flex-1 pb-4 flex-wrap max-w-6xl"></div>

  <button id="host-next-btn" onclick="hostRevealNext()" class="hidden relative z-10 jax-btn bg-[#ffd23f] text-[#1a1a2e] font-jax font-bold px-6 py-3 mb-4">
    Nächsten Platz enthüllen ➡️
  </button>

  <button id="host-end-btn" onclick="hostEndCeremony()" class="hidden relative z-10 jax-btn bg-[#ff2e93] text-white font-jax font-bold px-6 py-3 mb-4">
    Zurück zur Lobby
  </button>


  <img src="https://raw.githubusercontent.com/thundermon89-glitch/Quiznight/main/9455-removebg-preview.png" class="fixed bottom-2 left-2 h-16 md:h-20 w-auto z-30 pointer-events-none opacity-90" onerror="this.style.display='none'" alt="">
</body>
</html>
